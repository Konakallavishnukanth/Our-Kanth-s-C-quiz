<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanth's "C" quiz — C output questions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#111C24; --ink-2:#3D4E5A; --ink-3:#71828E;
  --paper:#E9EDF0; --card:#FFFFFF; --rule:#CBD5DC;
  --accent:#2F49D1; --accent-soft:#E4E8FB;
  --ok:#0E7A55; --ok-soft:#E1F2EA;
  --bad:#C0392F; --bad-soft:#FBE7E4;
  --warn:#A9740B;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); color:var(--ink); background-color:var(--paper);
  background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);
  background-size:28px 28px; background-position:-1px -1px;
  -webkit-font-smoothing:antialiased; line-height:1.5;
}
.wrap{max-width:880px;margin:0 auto;padding:28px 18px 80px}
.sheet{background:var(--card);border:1px solid var(--ink);border-radius:4px;box-shadow:6px 6px 0 rgba(17,28,36,.10)}
h1,h2,h3{font-family:var(--mono);font-weight:600;letter-spacing:-.02em;margin:0}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
button{font:inherit;cursor:pointer}
.btn{font-family:var(--mono);font-size:14px;padding:11px 20px;border-radius:3px;border:1px solid var(--ink);
     background:var(--card);color:var(--ink);transition:transform .08s ease,box-shadow .08s ease}
.btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 rgba(17,28,36,.18)}
.btn:active{transform:translate(0,0);box-shadow:none}
.btn.primary{background:var(--ink);color:#fff}
.btn.ghost{border-color:var(--rule);color:var(--ink-2);box-shadow:none}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- setup ---------- */
.hero{padding:38px 32px 30px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-size:40px}
.caret{display:inline-block;width:11px;height:26px;background:var(--accent);transform:translateY(3px);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.lede{margin:14px 0 0;max-width:56ch;color:var(--ink-2)}
.setup-block{border-top:1px solid var(--rule);padding:22px 32px}
.setup-block h3{font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--mono);font-size:13px;padding:8px 14px;border:1px solid var(--rule);border-radius:999px;background:#fff;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.chip .n{opacity:.6;margin-left:6px}
.start-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
           padding:22px 32px;border-top:1px solid var(--rule);background:#F7F9FA}
.count-note{font-family:var(--mono);font-size:13px;color:var(--ink-2)}
.tiny{font-size:12.5px;color:var(--ink-3);margin-top:8px}

/* ---------- test ---------- */
.topbar{position:sticky;top:0;z-index:5;background:rgba(233,237,240,.94);backdrop-filter:blur(6px);
        border-bottom:1px solid var(--rule);margin:-28px -18px 20px;padding:12px 18px}
.topbar-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.progress{flex:1;min-width:140px;height:6px;background:#D3DAE0;border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s ease}
.stat{font-family:var(--mono);font-size:13px;color:var(--ink-2);white-space:nowrap}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.qhead .sec{font-family:var(--mono);font-size:12px;color:var(--ink-3);letter-spacing:.06em}
.filebar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--rule);background:#F3F5F7;
         font-family:var(--mono);font-size:12.5px;color:var(--ink-2);border-radius:4px 4px 0 0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--rule)}
pre.code{margin:0;padding:16px 16px 16px 0;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.65;tab-size:4}
pre.code .ln{display:inline-block;width:38px;text-align:right;margin-right:14px;color:#A9B6C0;user-select:none}
.kw{color:#2F49D1;font-weight:500}.str{color:#0E7A55}.num{color:#A9740B}.fn{color:#7A3E9D}.cm{color:#8A97A1;font-style:italic}
.prompt{padding:18px 18px 4px;font-size:15px}
.opts{list-style:none;margin:0;padding:14px 18px 20px;display:grid;gap:9px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--rule);
     border-radius:3px;padding:12px 14px;font-family:var(--mono);font-size:13.5px;color:var(--ink);transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--ink-3);background:#FBFCFD}
.opt .key{flex:none;width:22px;height:22px;border:1px solid var(--rule);border-radius:3px;display:grid;place-items:center;
          font-size:11.5px;color:var(--ink-3)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .key{background:var(--accent);border-color:var(--accent);color:#fff}
.opt .txt{white-space:pre-wrap;word-break:break-word}
.navrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.palette{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px;padding:16px;border:1px dashed var(--rule);border-radius:4px;background:#F7F9FA}
.pbtn{width:32px;height:32px;border:1px solid var(--rule);background:#fff;border-radius:3px;font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.pbtn.done{background:var(--ink);color:#fff;border-color:var(--ink)}
.pbtn.now{outline:2px solid var(--accent);outline-offset:1px}

/* ---------- result ---------- */
.scoreboard{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:0}
.score-main{padding:32px;border-right:1px solid var(--rule)}
.bigscore{font-family:var(--mono);font-size:76px;line-height:1;letter-spacing:-.04em}
.bigscore small{font-size:26px;color:var(--ink-3)}
.verdict{font-family:var(--mono);font-size:14px;margin-top:10px}
.tally{display:flex;gap:18px;margin-top:22px;flex-wrap:wrap}
.tally div{font-family:var(--mono);font-size:13px}
.tally b{display:block;font-size:22px}
.t-ok b{color:var(--ok)} .t-bad b{color:var(--bad)} .t-skip b{color:var(--warn)}
.breakdown{padding:28px 32px}
.bd-row{margin-bottom:14px}
.bd-top{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12.5px;color:var(--ink-2);margin-bottom:5px}
.bar{height:8px;background:#E3E8EC;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .6s ease}
.review-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:26px 0 14px}
.rev{margin-bottom:14px;border-left:4px solid var(--rule)}
.rev.wrong{border-left-color:var(--bad)} .rev.right{border-left-color:var(--ok)} .rev.skip{border-left-color:var(--warn)}
.rev-head{display:flex;gap:10px;align-items:center;padding:12px 16px;font-family:var(--mono);font-size:13px;cursor:pointer;background:#fff}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:3px}
.tag.right{background:var(--ok-soft);color:var(--ok)} .tag.wrong{background:var(--bad-soft);color:var(--bad)} .tag.skip{background:#FAF0DC;color:var(--warn)}
.rev-body{display:none;border-top:1px solid var(--rule);padding:0 0 16px}
.rev.open .rev-body{display:block}
.answers{padding:14px 18px 0;font-family:var(--mono);font-size:13.5px}
.answers .row{margin-bottom:6px}
.answers .lbl{color:var(--ink-3);display:inline-block;min-width:106px}
.why{margin:12px 18px 0;padding:12px 14px;background:#F7F9FA;border-left:3px solid var(--accent);font-size:14px;color:var(--ink-2)}
.footer{text-align:center;font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-top:34px}
@media (max-width:760px){
  .scoreboard{grid-template-columns:1fr}
  .score-main{border-right:0;border-bottom:1px solid var(--rule)}
  .brand h1{font-size:30px}.bigscore{font-size:60px}
  .hero,.setup-block,.start-row,.breakdown,.score-main{padding-left:20px;padding-right:20px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- auth / topics / sharing / dashboard ---------- */
.topbar-user{display:flex;align-items:center;gap:10px;justify-content:flex-end;padding:14px 4px;font-family:var(--mono);font-size:13px;color:var(--ink-2)}
.topbar-user b{color:var(--ink)}
.pill{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.login-wrap{max-width:380px;margin:60px auto}
.field{margin-bottom:14px}
.field label{display:block;font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-bottom:5px;letter-spacing:.06em;text-transform:uppercase}
.field input{width:100%;font:15px/1.4 var(--sans);padding:11px 12px;border:1px solid var(--rule);border-radius:3px;background:#fff;color:var(--ink)}
.field input:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.err{color:var(--bad);font-family:var(--mono);font-size:12.5px;margin-top:10px;min-height:16px}
.topic-grid{display:flex;flex-wrap:wrap;gap:8px}
.share-block{border-top:1px solid var(--rule);padding:22px 32px;background:#F7F9FA}
.share-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.keybox{font-family:var(--mono);font-size:13px;padding:10px 12px;border:1px dashed var(--rule);border-radius:3px;background:#fff;word-break:break-all;flex:1;min-width:220px}
.badge-share{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;padding:6px 12px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-bottom:14px}
.badge-share.ended{background:var(--bad-soft);color:var(--bad)}
.dash-row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--rule);font-family:var(--mono);font-size:13px}
.dash-row:last-child{border-bottom:0}
.dash-row .nm{color:var(--ink);font-weight:600}
.dash-row .sc{color:var(--ink-2)}
.linkrow{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:12.5px}
.linkrow a, .linkbtn{color:var(--accent);cursor:pointer;text-decoration:underline;background:none;border:none;font:inherit;padding:0}
.note{font-size:12px;color:var(--ink-3);margin-top:10px}
</style>
</head>

arison uses the old values 5 and 5; both are incremented afterwards."},{"s":0,"p":"What is the output of the following code?","c":"int main()\n{\n    int num = 0;\n    if (num == 0 && num++)\n        printf(\"In\\n\");\n    printf(\"%d\\n\", num);\n    return 0;\n}","o":["0","1","In 1"],"a":"1","e":"The left side is true so num++ is evaluated; it yields 0 so the body is skipped, but num is now 1."},{"s":0,"p":"What is the output of the following code?","c":"int main()\n{\n    int i = 3;\n    if (i++ > 3 || ++i > 4)\n        printf(\"%d\\n\", i);\n    return 0;\n}","o":["3","4","5","Nothing"],"a":"5","e":"3 > 3 is false, so ++i runs making i 5, and 5 > 4 is true."},{"s":0,"p":"What is the output of the following code?","c":"int main()\n{\n    int i = 3;\n    if (i-- < 3 && --i)\n        printf(\"Y\");\n    else\n        printf(\"N\");\n    printf(\"%d\\n\", i);\n    return 0;\n}","o":["Y1","N2","N1","Y2"],"a":"N2","e":"3 < 3 is false so && short-circuits; only the post-decrement happened."},{"s":0,"p":"What is the output of the following code?","c":"int main()\n{\n    char ch = 'a';\n    if (ch >= 'a' && ch <= 'z')\n        printf(\"%c\\n\", ch - 32);\n    return 0;\n}","o":["a","A","97","65"],"a":"A","e":"Subtracting 32 from a lowercase letter gives its uppercase ASCII code."},{"s":0,"p":"What is the output of the following code?","c":"int main()\n{\n    int num = 10;\n    if (num % 3 == 1)\n        printf(\"Yes\\n\");\n    else\n        printf(\"No\\n\");\n    return 0;\n}","o":["Yes","No"],"a":"Yes","e":"10 % 3 is 1."},{"s":0,"p":"What is the output of the following code?","c":"int main()\n{\n    int num = -10;\n    printf(\"%d\\n\", num % 3);\n    return 0;\n}","o":["1","-1","2","-2"],"a":"-1","e":"In C the remainder takes the sign of the dividend."},{"s":0,"p":"What is the output of the following code?","c":"int main()\n{\n    int i = 0;\n    if (i)\n        printf(\"A\\n\");\n    else if (!i)\n        printf(\"B\\n\");\n    else\n        printf(\"C\\n\");\n    return 0;\n}","o":["A","B","C"],"a":"B","e":"i is 0, so the else-if condition !i is true."},{"s":1,"p":"What is the output of the following code?","c":"int main()\n{\n    int option = 25;\n    switch (option)\n    {\n        case 25:\n            printf(\"10\\n\");\n            break;\n        case 20 + 5:\n            printf(\"20\\n\");\n            break;\n        default:\n            printf(\"Try again\\n\");\n    }\n    return 0;\n}","o":["10","20","Try again","Compiler error"],"a":"Compiler error","e":"case 25 and case 20+5 are duplicate labels, which is not allowed."},{"s":1,"p":"What is the output of the following code?","c":"int main()\n{\n    int option = 25;\n    switch (option)\n    {\n        case 30 - 5:\n            printf(\"10\\n\");\n            break;\n        case 20:\n            printf(\"20\\n\");\n            break;\n        default:\n            printf(\"Try again\\n\");\n    }\n    return 0;\n}","o":["10","20","Try again","Compiler error"],"a":"10","e":"30-5 is a valid constant expression equal to 25, so the first case matches."},{"s":1,"p":"What is the output of the following code?","c":"int main()\n{\n    char ch = 'B';\n    switch (ch)\n    {\n        case 'A':\n            printf(\"Ay \");\n        case 'B':\n            printf(\"Bee \");\n        case 'C':\n            printf(\"Cee\\n\");\n            break;\n        default:\n            printf(\"None\\n\");\n    }\n    return 0;\n}","o":["Bee","Bee Cee","Ay Bee Cee","None"],"a":"Bee Cee","e":"Execution starts at case 'B' and falls through until the break."},{"s":1,"p":"What is the output of the following code?","c":"int main()\n{\n    int option = 2;\n    switch (option)\n    {\n        case 1:\n            printf(\"One \");\n        case 2:\n            printf(\"Two \");\n        case 3:\n            printf(\"Three \");\n        default:\n            printf(\"Default\\n\");\n    }\n    return 0;\n}","o":["Two","Two Three","Two Three Default","Default"],"a":"Two Three Default","e":"With no break statements, control falls through every remaining label including default."},{"s":1,"p":"What is the output of the following code?","c":"int main()\n{\n    int option = 25;\n    switch (option)\n    {\n        default:\n            printf(\"Try again \");\n        case 10:\n            printf(\"10\\n\");\n            break;\n        case 20:\n            printf(\"20\\n\");\n            break;\n    }\n    return 0;\n}","o":["Try again","Try again 10","10","Compiler error"],"a":"Try again 10","e":"No case matches, so default runs and then falls through into case 10."},{"s":1,"p":"What is the output of the following code?","c":"int main()\n{\n    float option = 25;\n    switch (option)\n    {\n        case 25:\n            printf(\"25\\n\");\n            break;\n        default:\n            printf(\"Try again\\n\");\n    }\n    return 0;\n}","o":["25","Try again","Compiler error"],"a":"Compiler error","e":"The switch controlling expression must have an integer type; a float is not allowed."},{"s":1,"p":"What is the output of the following code?","c":"int main()\n{\n    int option = 25;\n    int x = 25;\n    switch (option)\n    {\n        case x:\n            printf(\"Match\\n\");\n            break;\n        default:\n            printf(\"Try again\\n\");\n    }\n    return 0;\n}","o":["Match","Try again","Compiler error"],"a":"Compiler error","e":"A case label needs a constant expression; a variable will not do."},{"s":1,"p":"What is the output of the following code?","c":"int main()\n{\n    int option = 25;\n    const int x = 25;\n    switch (option)\n    {\n        case x:\n            printf(\"Match\\n\");\n            break;\n        default:\n            printf(\"Try again\\n\");\n    }\n    return 0;\n}","o":["Match","Try again","Compiler error"],"a":"Compiler error","e":"In C a const variable is still not an integer constant expression (unlike C++)."},{"s":1,"p":"What is the output of the following code?","c":"int main()\n{\n    switch ((int) 2.9)\n    {\n        case 2:\n            printf(\"Two\\n\");\n            break;\n        case 3:\n            printf(\"Three\\n\");\n            break;\n    }\n    return 0;\n}","o":["Two","Three","Compiler error"],"a":"Two","e":"Casting a float to int truncates towards zero, giving 2."},{"s":1,"p":"What is the output of the following code?","c":"int main()\n{\n    int option = 10;\n    switch (option)\n    {\n        case 10:\n            printf(\"10\\n\");\n            continue;\n        default:\n            printf(\"Try again\\n\");\n    }\n    return 0;\n}","o":["10","10 Try again","Compiler error"],"a":"Compiler error","e":"continue is only valid inside a loop, not inside a bare switch."},{"s":1,"p":"What is the output of the following code?","c":"int main()\n{\n    int i;\n    for (i = 0; i < 3; i++)\n    {\n        switch (i)\n        {\n            case 1:\n                continue;\n            default:\n                printf(\"%d \", i);\n        }\n        printf(\"* \");\n    }\n    printf(\"\\n\");\n    return 0;\n}","o":["0 * 1 * 2 *","0 * 2 *","0 1 2","Compiler error"],"a":"0 * 2 *","e":"continue inside a switch inside a loop jumps to the next loop iteration, skipping the trailing printf."},{"s":1,"p":"What is the output of the following code?","c":"int main()\n{\n    int i;\n    for (i = 0; i < 3; i++)\n    {\n        switch (i)\n        {\n            case 1:\n                break;\n            default:\n                printf(\"%d \", i);\n        }\n        printf(\"* \");\n    }\n    printf(\"\\n\");\n    return 0;\n}","o":["0 * 2 *","0 * * 2 *","0 1 2","Compiler error"],"a":"0 * * 2 *","e":"break leaves only the switch, so the loop body continues with the trailing printf."},{"s":1,"p":"What is the output of the following code?","c":"int main()\n{\n    switch (1 + 2 * 3)\n    {\n        case 9:\n            printf(\"Nine\\n\");\n            break;\n        case 7:\n            printf(\"Seven\\n\");\n            break;\n    }\n    return 0;\n}","o":["Nine","Seven","Nothing"],"a":"Seven","e":"Multiplication binds tighter than addition, so the value is 7."},{"s":1,"p":"What is the output of the following code?","c":"int main()\n{\n    int a = 1, b = 2;\n    switch (a)\n    {\n        case 1:\n            switch (b)\n            {\n                case 2:\n                    printf(\"A\");\n                case 3:\n                    printf(\"B\");\n            }\n        case 2:\n            printf(\"C\\n\");\n    }\n    return 0;\n}","o":["A","AB","ABC","AC"],"a":"ABC","e":"The inner switch falls through from case 2 to case 3, then the outer switch falls into case 2."},{"s":1,"p":"What is the output of the following code?","c":"int main()\n{\n    char ch = 'A';\n    switch (ch)\n    {\n        case 'A':\n            printf(\"Letter\\n\");\n            break;\n        case 65:\n            printf(\"Number\\n\");\n            break;\n    }\n    return 0;\n}","o":["Letter","Number","Compiler error"],"a":"Compiler error","e":"'A' and 65 are the same value, so these are duplicate case labels."},{"s":1,"p":"What is the output of the following code?","c":"int main()\n{\n    int option = 7;\n    switch (option)\n    {\n        case 1:\n            printf(\"One\\n\");\n            break;\n        case 2:\n            printf(\"Two\\n\");\n            break;\n    }\n    printf(\"Done\\n\");\n    return 0;\n}","o":["Done","One Done","Nothing","Compiler error"],"a":"Done","e":"No label matches and there is no default, so the switch body is skipped entirely."},{"s":1,"p":"What is the output of the following code?","c":"int main()\n{\n    int x = 1;\n    switch (x)\n    {\n        printf(\"Hi \");\n        case 1:\n            printf(\"One\\n\");\n    }\n    return 0;\n}","o":["Hi One","One","Compiler error"],"a":"One","e":"Control jumps straight to the matching label, so a statement before the first label never executes."},{"s":1,"p":"What is the output of the following code?","c":"int main()\n{\n    int option = 99;\n
