/* ---------------- events ---------------- */
function answer(i){
  if (!S || S.done) return;
  const q = S.qs[S.at];
  if (!q || i < 0 || i >= q.opts.length) return;
  S.given[S.at] = q.opts[i];
  if (S.at < S.qs.length - 1) S.at++;
  screenQuestion();
}

root.addEventListener('click', function(e){
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act;
  const i = el.dataset.i === undefined ? -1 : parseInt(el.dataset.i, 10);
  if (act === 'all') { picked = new Set(SECTIONS.map((_, k) => k)); screenSetup(); }
  else if (act === 'none') { picked = new Set(); screenSetup(); }
  else if (act === 'only') { const g = parseInt(el.dataset.g, 10); picked = new Set(SECTIONS.map((sc, k) => sc.g === g ? k : -1).filter(k => k >= 0)); screenSetup(); }
  else if (act === 'sec') { picked.has(i) ? picked.delete(i) : picked.add(i); screenSetup(); }
  else if (act === 'size') { size = parseInt(el.dataset.n, 10); screenSetup(); }
  else if (act === 'start') { startTest(); window.scrollTo(0, 0); }
  else if (act === 'pick') { answer(i); }
  else if (act === 'prev') { S.at--; screenQuestion(); }
  else if (act === 'next') { S.at++; screenQuestion(); }
  else if (act === 'clear') { S.given[S.at] = null; screenQuestion(); }
  else if (act === 'jump') { S.at = i; screenQuestion(); }
  else if (act === 'finish') { screenResult(); window.scrollTo(0, 0); }
  else if (act === 'submit') {
    const left = S.given.filter(x => x === null).length;
    if (!left || window.confirm(left + ' question(s) still unanswered. Score anyway?')) { screenResult(); window.scrollTo(0, 0); }
  }
  else if (act === 'toggle') { el.parentElement.classList.toggle('open'); }
  else if (act === 'filter') {
    const f = el.dataset.f;
    root.querySelectorAll('[data-act="filter"]').forEach(c => c.setAttribute('aria-pressed', c === el));
    root.querySelectorAll('.rev').forEach(card => {
      card.style.display = (f === 'all' || !card.classList.contains('right')) ? '' : 'none';
    });
  }
  else if (act === 'retake') { startTest(S.qs.map(q => ({...q, opts: shuffle(q.o)}))); window.scrollTo(0, 0); }
  else if (act === 'drill') {
    const miss = S.qs.filter((q, j) => S.given[j] !== q.a).map(q => ({...q, opts: shuffle(q.o)}));
    if (miss.length) { startTest(miss); window.scrollTo(0, 0); }
  }
  else if (act === 'new') { screenSetup(); window.scrollTo(0, 0); }
  else if (act === 'logout') { doLogout(); }
  else if (act === 'launch') { launchSharedTest(); }
  else if (act === 'join') { joinSharedTest(root.querySelector('#joinKey') && root.querySelector('#joinKey').value); }
  else if (act === 'endtest') { if (window.confirm('End this shared test for future joiners? Already-saved attempts stay on record.')) endSharedTest(); }
  else if (act === 'results') { navBack = () => screenSetup(); listScreen = () => screenMyResults(); screenMyResults(); window.scrollTo(0, 0); }
  else if (act === 'dashboard') { navBack = () => screenSetup(); listScreen = () => screenDashboard(); screenDashboard(); window.scrollTo(0, 0); }
  else if (act === 'viewresult') {
    const id = el.dataset.id;
    const rec = LS.get('cquiz_results', []).find(r => r.id === id);
    navBack = listScreen;
    screenAttemptReview(rec);
    window.scrollTo(0, 0);
  }
  else if (act === 'back') { navBack(); window.scrollTo(0, 0); }
});

root.addEventListener('submit', function(e){
  const form = e.target.closest('[data-form="login"]');
  if (!form) return;
  e.preventDefault();
  doLogin(form.querySelector('#u').value, form.querySelector('#p').value);
});

document.addEventListener('keydown', function(e){
  if (!S || S.done) return;
  if (/^[1-9]$/.test(e.key)) { answer(parseInt(e.key, 10) - 1); return; }
  if (e.key === 'ArrowRight' || e.key === 'Enter') { if (S.at < S.qs.length - 1) { S.at++; screenQuestion(); } }
  else if (e.key === 'ArrowLeft') { if (S.at > 0) { S.at--; screenQuestion(); } }
});

session ? screenSetup() : screenLogin();

/* exposed for the offline smoke test only */
window.__cquiz = { get S(){ return S; }, startTest, screenQuestion, screenResult, screenSetup, shuffle, highlight, BANK, SECTIONS };
})();
</script>
