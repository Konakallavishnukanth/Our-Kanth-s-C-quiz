h hold indeterminate values"],"a":"A is all zeros, B holds indeterminate values","e":"A partial initialiser zero-fills the rest; an uninitialised local array does not."},{"s":11,"p":"Which statement is true about these two loops?","c":"/* Code A */\nfor (i = 0; i < n; i++)\n    sum += i;\n\n/* Code B */\ni = 0;\nwhile (i < n)\n{\n    sum += i;\n    i++;\n}","o":["They are equivalent","A runs one extra time","B runs one extra time","B is an infinite loop"],"a":"They are equivalent","e":"A for loop is just a while loop with its init and update moved into the header."},{"s":11,"p":"How many times does each loop run when n is 0?","c":"/* Code A */\nfor (i = 0; i < n; i++) body();\n\n/* Code B */\ni = 0;\ndo { body(); } while (i < n);","o":["A: 0, B: 0","A: 0, B: 1","A: 1, B: 0","A: 1, B: 1"],"a":"A: 0, B: 1","e":"The do-while body runs before its first test."},{"s":11,"p":"Which statement about the comma operator is true?","c":"","o":["It has the highest precedence in C","It has the lowest precedence and yields the right-hand value","It yields the left-hand value","It cannot appear in a for header"],"a":"It has the lowest precedence and yields the right-hand value","e":"Operands are evaluated left to right and the last one is the result."},{"s":11,"p":"Which has higher precedence?","c":"","o":["&& is higher than ||","|| is higher than &&","They are equal","It depends on the compiler"],"a":"&& is higher than ||","e":"a || b && c groups as a || (b && c)."},{"s":11,"p":"Which statement about short-circuit evaluation is true?","c":"","o":["Both sides of && are always evaluated","If the left side of && is 0, the right side is not evaluated","If the left side of || is 0, the right side is not evaluated","Short-circuiting applies to & and |"],"a":"If the left side of && is 0, the right side is not evaluated","e":"The result is already known, so the second operand is skipped along with its side effects."},{"s":11,"p":"Which statement is true about these two snippets?","c":"/* Code A */\nint x = 5;\nx += 1;\n\n/* Code B */\nint x = 5;\nx = x + 1;","o":["They give different results","They give the same result","A is a compiler error","B is a compiler error"],"a":"They give the same result","e":"Compound assignment is shorthand for the same operation, evaluating x only once."},{"s":11,"p":"What is the result of an assignment expression such as (x = 7)?","c":"","o":["1 if it succeeded","The value assigned, 7","0","It has no value"],"a":"The value assigned, 7","e":"That is why chained assignment and if (x = 7) both work."},{"s":11,"p":"Which statement about a switch controlling expression is true?","c":"","o":["It may be a float","It must have an integer type","It may be a string","It may be any type"],"a":"It must have an integer type","e":"Integer types, including char and enum, are allowed; floating point is not."},{"s":11,"p":"Which statement about default in a switch is true?","c":"","o":["It must be the last label","It may appear anywhere and runs when nothing matches","There may be two of them","It is required"],"a":"It may appear anywhere and runs when nothing matches","e":"Its position affects fallthrough but not when it is selected."},{"s":11,"p":"Which statement about integer overflow in C is true?","c":"","o":["Signed and unsigned both wrap around safely","Unsigned wraps around; signed overflow is undefined","Signed wraps around; unsigned overflow is undefined","Both are compiler errors"],"a":"Unsigned wraps around; signed overflow is undefined","e":"Unsigned arithmetic is modular by definition; signed overflow has no defined behaviour."},{"s":12,"p":"What is the output of the following code?","c":"int main()\n{\n    int arr[] = {};\n    printf(\"%zu\", sizeof(arr));\n}","o":["Segmentation fault","0","Compiler error","4"],"a":"0","e":"gcc accepts an empty initialiser as an extension and gives the array zero size."},{"s":12,"p":"What is the output of the following code?","c":"int main()\n{\n    int arr[5] = {1, 2};\n    printf(\"%zu %d\", sizeof(arr), arr[4]);\n}","o":["20 0","8 0","20 2","8 2"],"a":"20 0","e":"The array is always five ints wide and the missing elements are zero."},{"s":12,"p":"What is the output of the following code?","c":"int main()\n{\n    char s[] = \"hello\";\n    printf(\"%zu\", sizeof(s));\n}","o":["5","6","4","8"],"a":"6","e":"The array includes the terminating null byte."},{"s":12,"p":"What is the output of the following code?","c":"int main()\n{\n    int a[3][4];\n    printf(\"%zu\", sizeof(a));\n}","o":["12","48","16","4"],"a":"48","e":"Twelve ints of four bytes each."},{"s":12,"p":"What is the output of the following code?","c":"int main()\n{\n    int a[10];\n    printf(\"%zu\", sizeof(a) / sizeof(a[0]));\n}","o":["10","40","4","1"],"a":"10","e":"Total size divided by element size gives the element count."},{"s":12,"p":"What is the output of the following code?","c":"int f()\n{\n    static int c = 0;\n    c++;\n    return c;\n}\n\nint main()\n{\n    printf(\"%d %d %d\", f(), f(), f());\n}","o":["1 2 3","3 3 3","Undefined behaviour","1 1 1"],"a":"Undefined behaviour","e":"The order in which the three calls run is unspecified, so the printed order is not guaranteed."},{"s":12,"p":"What is the output of the following code?","c":"int f()\n{\n    static int c = 0;\n    return ++c;\n}\n\nint main()\n{\n    int a = f(), b = f(), c = f();\n    printf(\"%d %d %d\", a, b, c);\n}","o":["1 1 1","1 2 3","3 3 3","0 1 2"],"a":"1 2 3","e":"A static local keeps its value between calls, and each declaration is a separate statement."},{"s":12,"p":"What is the output of the following code?","c":"int x = 5;\n\nint main()\n{\n    int x = 10;\n    {\n        int x = 20;\n        printf(\"%d \", x);\n    }\n    printf(\"%d\", x);\n}","o":["20 10","10 20","5 10","20 20"],"a":"20 10","e":"The innermost declaration hides the outer ones inside its block."},{"s":12,"p":"What is the output of the following code?","c":"int main()\n{\n    int i;\n    static int s;\n    printf(\"%d\", s);\n}","o" {1, 2, 3};\n    int i, sum = 0;\n    for (i = 0; i <= 3; i++)\n        sum += a[i];\n    printf(\"Reads %d elements\", i);\n}","o":["Reads 3 elements","Reads 4 elements","Compiler error","Reads 0 elements"],"a":"Reads 4 elements","e":"The <= makes the loop read a[3], which is one past the end of the array."},{"s":12,"p":"What is the output of the following code?","c":"int main()\n{\n    enum color { RED, GREEN, BLUE };\n    printf(\"%d %d\", RED, BLUE);\n}","o":["0 2","1 3","0 3","Compiler error"],"a":"0 2","e":"Enumerators count from 0 unless given explicit values."},{"s":12,"p":"What is the output of the following code?","c":"int main()\n{\n    enum level { LOW = 5, MID, HIGH };\n    printf(\"%d\", HIGH);\n}","o":["2","6","7","Compiler error"],"a":"7","e":"Later enumerators continue from the last assigned value."},{"s":12,"p":"What is the output of the following code?","c":"#define SQ(x) x * x\n\nint main()\n{\n    printf(\"%d\", SQ(2 + 3));\n}","o":["25","11","10","Compiler error"],"a":"11","e":"Text substitution gives 2 + 3 * 2 + 3, so the macro needs parentheses."},{"s":13,"p":"What is the output of the following code?","c":"int main()\n{\n    int a = 10;\n    int *p = &a;\n    printf(\"%d\", *p);\n}","o":["10","Address of a","Garbage value","Compiler error"],"a":"10","e":"Dereferencing the pointer reads the value it points to."},{"s":13,"p":"What is the output of the following code?","c":"int main()\n{\n    int a = 10;\n    int *p = &a;\n    *p = 20;\n    printf(\"%d\", a);\n}","o":["10","20","Garbage value","Compiler error"],"a":"20","e":"Writing through the pointer changes the original variable."},{"s":13,"p":"What is the output of the following code?","c":"int main()\n{\n    int a = 10;\n    printf(\"%d\", *&a);\n}","o":["10","Address of a","Compiler error","Garbage value"],"a":"10","e":"& takes the address and * immediately follows it back to the value."},{"s":13,"p":"What is the output of the following code?","c":"int main()\n{\n    int num = 0;\n    int *iptr = &num;\n    if (iptr)\n        printf(\"Meet me later\");\n    else\n        printf(\"Hello are you sure!!\");\n}","o":["Nothing","Meet me later","Hello are you sure!!","Compile time error"],"a":"Meet me later","e":"The test asks whether the pointer is non-null, not whether the value it points at is non-zero."},{"s":13,"p":"What is the output of the following code?","c":"int main()\n{\n    int *p = NULL;\n    if (p)\n        printf(\"Valid\");\n    else\n        printf(\"Null\");\n}","o":["Valid","Null","Segmentation fault","Compiler error"],"a":"Null","e":"A null pointer is false in a condition."},{"s":13,"p":"What is the output of the following code on a 64-bit system?","c":"int main()\n{\n    int *p;\n    char *q;\n    printf(\"%zu %zu\", sizeof(p), sizeof(q));\n}","o":["4 1","8 8","4 4","8 1"],"a":"8 8","e":"Every object pointer is the same size, regardless of what it points to."},{"s":13,"p":"What is the output of the following code?","c":"int main()\n{\n    int a = 5;\n    int *p = &a;\n    printf(\"%zu %zu\", sizeof(p), sizeof(*p));\n}","o":["8 4","4 4","8 8","4 8"],"a":"8 4","e":"sizeof(*p) is the size of the pointed-to type, an int."},{"s":13,"p":"What is the output of the following code?","c":"int main()\n{\n    int a = 5, b = 10;\n    int *p = &a;\n    p = &b;\n    *p = 20;\n    printf(\"%d %d\", a, b);\n}","o":["20 10","5 20","20 20","5 10"],"a":"5 20","e":"The pointer was redirected to b before the write."},{"s":13,"p":"What is the output of the following code?","c":"int main()\n{\n    int a = 7;\n    int *p = &a;\n    int **pp = &p;\n    printf(\"%d\", **pp);\n}","o":["7","Address of a","Compiler error","Garbage value"],"a":"7","e":"Two dereferences step through the pointer to pointer down to the value."},{"s":13,"p":"What is the output of the following code?","c":"int main()\n{\n    int a = 7;\n    int *p = &a;\n    int **pp = &p;\n    **pp = 9;\n    printf(\"%d\", a);\n}","o":["7","9","Compiler error","Garbage value"],"a":"9","e":"Writing through both levels reaches the original variable."},{"s":13,"p":"What is the output of the following code?","c":"int main()\n{\n    int a = 10;\n    int *p = &a;\n    printf(\"%d\", ++*p);\n}","o":["10","11","Compiler error","Address"],"a":"11","e":"*p is an lvalue, so the pre-increment adds one to a."},{"s":13,"p":"What is the output of the following code?","c":"int main()\n{\n    int a = 10;\n    int *p = &a;\n    (*p)++;\n    printf(\"%d\", a);\n}","o":["10","11","Compiler error","Garbage value"],"a":"11","e":"The parentheses make the increment apply to the pointed-to value."},{"s":13,"p":"What is the output of the following code?","c":"int main()\n{\n    int a[3] = {10, 20, 30};\n    int *p = a;\n    printf(\"%d %d\", *p, *(p + 1));\n}","o":["10 20","10 11","20 30","Compiler error"],"a":"10 20","e":"Adding one to an int pointer moves it forward by one element."},{"s":13,"p":"What is the output of the following code?","c":"int main()\n{\n    int a[3] = {10, 20, 30};\n    int *p = a;\n    printf(\"%d\", *p + 1);\n}","o":["10","11","20","Compiler error"],"a":"11","e":"Without parentheses the dereference happens first, then 1 is added to the value."},{"s":13,"p":"What is the output of the following code?","c":"int main()\n{\n    int a[3] = {10, 20, 30};\n    int *p = a;\n    printf(\"%d \", *p++);\n    printf(\"%d\", *p);\n}","o":["10 20","11 20","20 30","10 10"],"a":"10 20","e":"*p++ reads the current element and then advances the pointer."},{"s":13,"p":"What is the output of the following code?","c":"int main()\n{\n    int a = 5;\n    int *p = &a;\n    printf(\"%d\", p == &a);\n}","o":["0","1","5","Compiler error"],"a":"1","e":"The pointer holds exactly that address, so the comparison is true."},{"s":13,"p":"What is the output of the following code?","c":"int main()\n{\n    int a[5] = {1, 2, 3, 4, 5};\n    printf(\"%d\", *a);\n}","o":["1","5","Address of a","Compiler error"],"a":"1","e":"An array name decays to a pointer to its first element."},{"s":13,"p":"What is the output of the following code?","c":"int main()\n{\n    int a[5] = {1, 2, 3, 4, 5};\n    printf(\"%d\", a == &a[0]);\n}","o":["0","1","Compiler error","Garbage value"],"a":"1","e":"The array name and the address of the first element are the same value."},{"s":13,"p":"What is the output of the following code?","c":"int main()\n{\n    int a[5] = {1, 2, 3, 4, 5};\n    int *p = a;\n    int *q = &a[3];\n    printf(\"%ld\", q - p);\n}","o":["3","12","4","1"],"a":"3","e":"Pointer subtraction counts elements, not bytes."},{"s":13,"p":"What is the output of the following code?","c":"int main()\n{\n    char s[] = \"abc\";\n    char *p = s;\n    printf(\"%c%c\", *p, *(p + 2));\n}","o":["ab","ac","abc","Compiler error"],"a":"ac","e":"Adding 2 to a char pointer moves two bytes forward."},{"s":13,"p":"What is the output of the following code?","c":"int main()\n{\n    int a = 65;\n    void *v = &a;\n    printf(\"%d\", *(int *) v);\n}","o":["65","A","Compiler error","Garbage value"],"a":"65","e":"A void pointer must be cast back before it can be dereferenced."},{"s":13,"p":"What is the output of the following code?","c":"int main()\n{\n    int a = 5;\n    void *v = &a;\n    printf(\"%d\", *v);\n}","o":["5","0","Compiler error","Garbage value"],"a":"Compiler error","e":"A void pointer cannot be dereferenced without a cast, because its target has no size."},{"s":13,"p":"What is the output of the following code?","c":"int main()\n{\n    int a = 10, b = 20;\n    int *p1 = &a, *p2 = &b;\n    int t = *p1;\n    *p1 = *p2;\n    *p2 = t;\n    printf(\"%d %d\", a, b);\n}","o":["10 20","20 10","10 10","20 20"],"a":"20 10","e":"The classic swap through pointers exchanges the two values."},{"s":13,"p":"What is the output of the following code?","c":"int main()\n{\n    int a = 10;\n    int *p = &a;\n    int *q = p;\n    *q = 30;\n    printf(\"%d\", *p);\n}","o":["10","30","Garbage value","Compiler error"],"a":"30","e":"Both pointers hold the same address, so they see the same object."},{"s":13,"p":"What is the output of the following code?","c":"int main()\n{\n    const int a = 5;\n    const int *p = &a;\n    printf(\"%d\", *p);\n}","o":["5","0","Compiler error","Garbage value"],"a":"5","e":"A pointer to const may read the value; only writing through it is forbidden."},{"s":13,"p":"What is the output of the following code?","c":"int main()\n{\n    int a = 5;\n    const int *p = &a;\n    *p = 6;\n    printf(\"%d\", a);\n}","o":["5","6","Compiler error","Garbage value"],"a":"Compiler error","e":"The pointer promises not to modify its target."},{"s":13,"p":"What is the output of the following code?","c":"int main()\n{\n    int a = 5, b = 6;\n    int *const p = &a;\n    p = &b;\n    printf(\"%d\", *p);\n}","o":["5","6","Compiler error","Garbage value"],"a":"Compiler error","e":"With int *const the pointer itself is constant and cannot be redirected."},{"s":13,"p":"What is the output of the following code?","c":"int main()\n{\n    int a[3] = {1, 2, 3};\n    int *p = a;\n    p++;\n    printf(\"%d\", *p);\n}","o":["1","2","3","Address"],"a":"2","e":"Incrementing the pointer moves it to the next element."},{"s":13,"p":"What is the output of the following code?","c":"int main()\n{\n    int a[3] = {1, 2, 3};\n    printf(\"%d\", *(a + 2));\n}","o":["1","2","3","Compiler error"],"a":"3","e":"*(a+i) is exactly what a[i] means."},{"s":13,"p":"What is the output of the following code?","c":"int main()\n{\n    int a[3] = {1, 2, 3};\n    printf(\"%d\", 2[a]);\n}","o":["3","2","Compiler error","Garbage value"],"a":"3","e":"a[2] is *(a+2), and addition commutes, so 2[a] is legal and identical."},{"s":13,"p":"What is the output of the following code?","c":"int main()\n{\n    int a = 10;\n    int *p = &a;\n    printf(\"%d\", *p * 2);\n}","o":["10","20","Compiler error","Address"],"a":"20","e":"The dereference binds first, then the multiplication."},{"s":13,"p":"What is the output of the following code?","c":"int main()\n{\n    int x = 4;\n    int *p = &x;\n    *p += 3;\n    printf(\"%d\", x);\n}","o":["4","7","3","Compiler error"],"a":"7","e":"Compound assignment through the pointer updates x."},{"s":13,"p":"What is the output of the following code?","c":"int main()\n{\n    int val = 1237;\n    int *ptr = &val;\n    ++val;\n    printf(\"%d %d\", val, *ptr);\n}","o":["1238 1237","1238 1238","1237 1237","Undefined behaviour"],"a":"1238 1238","e":"The increment finishes before the printf, and both arguments read the same updated object."},{"s":13,"p":"What is the output of the following code?","c":"int main()\n{\n    int a[2] = {5, 9};\n    int *p = a;\n    printf(\"%d\", p[1]);\n}","o":["5","9","Compiler error","Address"],"a":"9","e":"A pointer can be indexed exactly like an array."},{"s":13,"p":"What is the output of the following code?","c":"int main()\n{\n    int *p;\n    *p = 5;\n    printf(\"%d\", *p);\n}","o":["5","0","Undefined behaviour","Compiler error"],"a":"Undefined behaviour","e":"p was never pointed at anything, so writing through it is not defined."},{"s":13,"p":"What is the output of the following code?","c":"int main()\n{\n    int val = 1237;\n    int *ptr = &val;\n    printf(\"%d %d\", ++val, *ptr);\n}","o":["1238 1237","1238 1238","1237 1237","Undefined behaviour"],"a":"Undefined behaviour","e":"val is modified and read through ptr in one unsequenced expression. Note that gcc happens to print 1238 1237, which is the answer some exam keys give."},{"s":14,"p":"What is the output of the following code?","c":"int main()\n{\n    int a[5] = {1, 2, 3, 4, 5};\n    int *p = a;\n    p += 2;\n    printf(\"%d\", *p);\n}","o":["1","2","3","Address"],"a":"3","e":"Adding 2 to an int pointer skips two elements."},{"s":14,"p":"What is the output of the following code?","c":"int main()\n{\n    int a[5] = {1, 2, 3, 4, 5};\n    printf(\"%d\", *(a + 4) - *a);\n}","o":["4","5","1","Compiler error"],"a":"4","e":"5 minus 1."},{"s":14,"p":"What is the output of the following code?","c":"int main()\n{\n    int a[5] = {1, 2, 3, 4, 5};\n    int *p = &a[4];\n    printf(\"%d\", *--p);\n}","o":["5","4","3","Compiler error"],"a":"4","e":"The pointer steps back one element before the read."},{"s":14,"p":"What is the output of the following code?","c":"int main()\n{\n    int a[5] = {1, 2, 3, 4, 5};\n    int i;\n    int *p = a;\n    for (i = 0; i < 5; i++)\n        printf(\"%d \", *(p + i));\n}","o":["1 2 3 4 5","1 1 1 1 1","5 4 3 2 1","Compiler error"],"a":"1 2 3 4 5","e":"*(p+i) walks the array element by element."},{"s":14,"p":"What is the output of the following code?","c":"int main()\n{\n    int a[5] = {1, 2, 3, 4, 5};\n    int *p = a, *q = a + 4;\n    printf(\"%d\", *q - *p);\n}","o":["4","16","1","5"],"a":"4","e":"This subtracts the values, not the addresses."},{"s":14,"p":"What is the output of the following code?","c":"int main()\n{\n    int a[5];\n    printf(\"%zu %zu\", sizeof(a), sizeof(&a[0]));\n}","o":["20 8","20 4","5 8","8 8"],"a":"20 8","e":"The array is 20 bytes, but an address is 8 bytes on a 64-bit system."},{"s":14,"p":"What is the output of the following code?","c":"void f(int a[])\n{\n    printf(\"%zu\", sizeof(a));\n}\n\nint main()\n{\n    int a[5];\n    f(a);\n}","o":["20","8","5","4"],"a":"8","e":"An array parameter is really a pointer, so sizeof gives the pointer size."},{"s":14,"p":"What is the output of the following code?","c":"int main()\n{\n    int a[3][2] = {{1, 2}, {3, 4}, {5, 6}};\n    printf(\"%d\", *(*(a + 1) + 1));\n}","o":["2","3","4","6"],"a":"4","e":"a+1 is the second row and +1 within it is the second column."},{"s":14,"p":"What is the output of the following code?","c":"int main()\n{\n    int a[3][2] = {{1, 2}, {3, 4}, {5, 6}};\n    printf(\"%zu\", sizeof(a[0]));\n}","o":["4","8","24","2"],"a":"8","e":"Each row is two ints, so eight bytes."},{"s":14,"p":"What is the output of the following code?","c":"int main()\n{\n    char s[] = \"hello\";\n    char *p = s;\n    printf(\"%zu %zu\", sizeof(s), sizeof(p));\n}","o":["6 8","5 8","6 6","8 8"],"a":"6 8","e":"The array knows its full length including the terminator; the pointer does not."},{"s":14,"p":"What is the output of the following code?","c":"int main()\n{\n    int a[5] = {1, 2, 3, 4, 5};\n    int *p = a + 1;\n    printf(\"%d %d\", p[-1], p[3]);\n}","o":["1 5","2 4","1 4","Compiler error"],"a":"1 5","e":"Negative indexing off a pointer into the middle of an array is legal."},{"s":14,"p":"What is the output of the following code?","c":"int main()\n{\n    int a[5] = {1, 2, 3, 4, 5};\n    int *p = a;\n    *p++ = 10;\n    printf(\"%d %d\", a[0], *p);\n}","o":["10 2","1 10","10 10","2 2"],"a":"10 2","e":"The write happens through the old address, then the pointer advances."},{"s":14,"p":"What is the output of the following code?","c":"int main()\n{\n    int a[5] = {1, 2, 3, 4, 5};\n    int *p = a;\n    ++*p;\n    printf(\"%d %d\", a[0], *p);\n}","o":["1 1","2 2","1 2","2 1"],"a":"2 2","e":"The value is incremented in place; the pointer never moves."},{"s":14,"p":"What is the output of the following code?","c":"int main()\n{\n    int i;\n    int array[5] = {1, 2, 3, 4, 5};\n    for (i = -1; i < sizeof(array) / sizeof(int) - 1; i++)\n        printf(\"%d \", array[i + 1]);\n}","o":["1 2 3 4 5","Does not enter the loop","Infinite loop","Compilation error"],"a":"Does not enter the loop","e":"The sizeof expression is unsigned, so -1 converts to a huge value and the test fails at once."},{"s":14,"p":"What is the output of the following code?","c":"int main()\n{\n    int a[5] = {1, 2, 3, 4, 5};\n    int i;\n    for (i = 0; i < 5; i++)\n        printf(\"%d \", *(a++));\n}","o":["1 2 3 4 5","Compiler error","Garbage values","1 1 1 1 1"],"a":"Compiler error","e":"An array name is not a modifiable lvalue, so it cannot be incremented."},{"s":14,"p":"What is the output of the following code?","c":"int main()\n{\n    int a[5] = {1, 2, 3, 4, 5};\n    int *p = a;\n    printf(\"%d\", *(p + 5 - 1));\n}","o":["4","5","1","Garbage value"],"a":"5","e":"That is the last element, a[4]."},{"s":14,"p":"What is the output of the following code?","c":"int main()\n{\n    char a[] = {'a', 'b', 'c', '\\0'};\n    char *p = a;\n    while (*p)\n    {\n        printf(\"%c\", *p);\n        p++;\n    }\n}","o":["abc","abc0","Infinite loop","Compiler error"],"a":"abc","e":"The loop stops when it reaches the null terminator."},{"s":14,"p":"What is the output of the following code?","c":"int main()\n{\n    int a[4] = {10, 20, 30, 40};\n    int *p = a;\n    printf(\"%d\", *(p++) + *(p++));\n}","o":["30","50","Undefined behaviour","20"],"a":"Undefined behaviour","e":"p is modified twice in one expression with no sequence point."},{"s":14,"p":"What is the output of the following code?","c":"int main()\n{\n    int a[3] = {1, 2, 3};\n    int *p = a;\n    int *q = a;\n    printf(\"%d\", p == q);\n}","o":["0","1","Compiler error","Garbage value"],"a":"1","e":"Both point at the same first element."},{"s":14,"p":"What is the output of the following code?","c":"int main()\n{\n    int a[3] = {1, 2, 3};\n    printf(\"%zu\", sizeof(a) / sizeof(*a));\n}","o":["3","12","4","1"],"a":"3","e":"Total bytes divided by the size of one element."},{"s":14,"p":"What is the output of the following code?","c":"void f(int *a)\n{\n    a[0] = 99;\n}\n\nint main()\n{\n    int a[3] = {1, 2, 3};\n    f(a);\n    printf(\"%d\", a[0]);\n}","o":["1","99","Compiler error","Garbage value"],"a":"99","e":"Arrays are passed as pointers, so the function edits the caller's data."},{"s":14,"p":"What is the output of the following code?","c":"void f(int a)\n{\n    a = 99;\n}\n\nint main()\n{\n    int a = 1;\n    f(a);\n    printf(\"%d\", a);\n}","o":["1","99","0","Compiler error"],"a":"1","e":"A plain int argument is a copy, so the caller's variable is untouched."},{"s":14,"p":"What is the output of the following code?","c":"int main()\n{\n    int a[2][3] = {{1, 2, 3}, {4, 5, 6}};\n    int *p = &a[0][0];\n    printf(\"%d\", *(p + 4));\n}","o":["4","5","6","Garbage value"],"a":"5","e":"A 2D array is laid out row after row in one continuous block."},{"s":14,"p":"What is the output of the following code?","c":"int main()\n{\n    int a[5] = {1, 2, 3, 4, 5};\n    int *p = a + 2;\n    printf(\"%ld\", p - a);\n}","o":["2","8","3","1"],"a":"2","e":"The difference is measured in elements."},{"s":14,"p":"What is the output of the following code?","c":"int main()\n{\n    char c[4] = {'a', 'b', 'c', 'd'};\n    char *p = c;\n    printf(\"%ld\", (c + 3) - c);\n}","o":["1","3","12","Compiler error"],"a":"3","e":"Char elements are one byte, so the element count and byte count agree."},{"s":14,"p":"What is the output of the following code?","c":"int main()\n{\n    int a[5] = {1, 2, 3, 4, 5};\n    int *p = a;\n    p = p + 1;\n    p = p - 1;\n    printf(\"%d\", *p);\n}","o":["1","2","0","Garbage value"],"a":"1","e":"The pointer ends up back where it started."},{"s":14,"p":"What is the output of the following code?","c":"int main()\n{\n    int a[3] = {1, 2, 3};\n    int i = 0;\n    printf(\"%d\", a[i] + i[a]);\n}","o":["1","2","3","Compiler error"],"a":"2","e":"i[a] is the same as a[i], so this is 1 + 1."},{"s":14,"p":"What is the output of the following code?","c":"int main()\n{\n    int a[5] = {1, 2, 3, 4, 5};\n    printf(\"%d\", a[10] == a[10]);\n}","o":["0","1","Compiler error","Segmentation fault"],"a":"1","e":"Reading out of bounds is undefined, but the comparison of a value with itself is what the option offers; in practice gcc prints 1."},{"s":14,"p":"What is the output of the following code?","c":"void f(int *p)\n{\n    p = NULL;\n}\n\nint main()\n{\n    int a = 5;\n    int *p = &a;\n    f(p);\n    printf(\"%d\", *p);\n}","o":["5","0","Segmentation fault","Compiler error"],"a":"5","e":"The function changed only its own copy of the pointer."},{"s":14,"p":"What is the output of the following code?","c":"void f(int **p)\n{\n    static int b = 9;\n    *p = &b;\n}\n\nint main()\n{\n    int a = 5;\n    int *p = &a;\n    f(&p);\n    printf(\"%d\", *p);\n}","o":["5","9","Segmentation fault","Compiler error"],"a":"9","e":"Passing the address of the pointer lets the function redirect it."},{"s":15,"p":"What is the output of the following code?","c":"int main()\n{\n    char *s = \"hello\";\n    printf(\"%s\", s);\n}","o":["hello","h","Address","Compiler error"],"a":"hello","e":"%s follows the pointer and prints until the null terminator."},{"s":15,"p":"What is the output of the following code?","c":"int main()\n{\n    char s[] = \"hello\";\n    printf(\"%c\", s[4]);\n}","o":["l","o","\\0","Compiler error"],"a":"o","e":"Indexing counts from zero, so s[4] is the last letter."},{"s":15,"p":"What is the output of the following code?","c":"int main()\n{\n    char s[] = \"hello\";\n    printf(\"%s\", s + 2);\n}","o":["hello","llo","he","o"],"a":"llo","e":"Starting the pointer two characters in prints the rest of the string."},{"s":15,"p":"What is the output of the following code?","c":"int main()\n{\n    char s[] = \"hello\";\n    s[0] = 'H';\n    printf(\"%s\", s);\n}","o":["hello","Hello","Segmentation fault","Compiler error"],"a":"Hello","e":"A char array holds a modifiable copy of the literal."},{"s":15,"p":"What is the output of the following code?","c":"int main()\n{\n    char *s = \"hello\";\n    s[0] = 'H';\n    printf(\"%s\", s);\n}","o":["hello","Hello","Segmentation fault","Compiler error"],"a":"Segmentation fault","e":"A string literal lives in read-only memory, so writing to it crashes the program."},{"s":15,"p":"What is the output of the following code?","c":"#include <string.h>\n\nint main()\n{\n    char s[] = \"hello\";\n    printf(\"%zu %zu\", strlen(s), sizeof(s));\n}","o":["5 5","5 6","6 6","6 5"],"a":"5 6","e":"strlen counts characters; sizeof also counts the terminator."},{"s":15,"p":"What is the output of the following code?","c":"int main()\n{\n    char s[10] = \"hi\";\n    printf(\"%zu\", sizeof(s));\n}","o":["2","3","10","8"],"a":"10","e":"sizeof reports the declared array size, not the string length."},{"s":15,"p":"What is the output of the following code?","c":"int main()\n{\n    char *s = \"hello\";\n    printf(\"%c\", *(s + 1));\n}","o":["h","e","l","Compiler error"],"a":"e","e":"Adding one to the char pointer moves to the second character."},{"s":15,"p":"What is the output of the following code?","c":"int main()\n{\n    char s[] = \"abc\";\n    char *p = s;\n    while (*p != '\\0')\n        p++;\n    printf(\"%ld\", p - s);\n}","o":["2","3","4","Infinite loop"],"a":"3","e":"The pointer stops on the terminator, which is three characters in."},{"s":15,"p":"What is the output of the following code?","c":"#include <string.h>\n\nint main()\n{\n    char a[20] = \"abc\";\n    strcat(a, \"def\");\n    printf(\"%s %zu\", a, strlen(a));\n}","o":["abcdef 6","abcdef 7","def 3","Compiler error"],"a":"abcdef 6","e":"strcat appends in place and strlen counts the six letters."},{"s":15,"p":"What is the output of the following code?","c":"#include <string.h>\n\nint main()\n{\n    printf(\"%d\", strcmp(\"abc\", \"abc\"));\n}","o":["0","1","-1","Compiler error"],"a":"0","e":"strcmp returns zero when the strings match."},{"s":15,"p":"What is the output of the following code?","c":"#include <string.h>\n\nint main()\n{\n    printf(\"%d\", strcmp(\"abc\", \"abd\") < 0);\n}","o":["0","1","-1","Compiler error"],"a":"1","e":"\"abc\" sorts before \"abd\", so the result is negative."},{"s":15,"p":"What is the output of the following code?","c":"int main()\n{\n    char s[] = \"hello\";\n    int i;\n    for (i = 0; s[i]; i++)\n        ;\n    printf(\"%d\", i);\n}","o":["4","5","6","Infinite loop"],"a":"5","e":"The loop stops at the null terminator after counting five characters."},{"s":15,"p":"What is the output of the following code?","c":"int main()\n{\n    printf(\"%d\", \"hello\"[1]);\n}","o":["e","101","Compiler error","h"],"a":"101","e":"%d prints the character code of 'e', which is 101."},{"s":15,"p":"What is the output of the following code?","c":"int main()\n{\n    char s[] = \"hello\";\n    printf(\"%zu\", sizeof(\"hello\"));\n}","o":["5","6","8","10"],"a":"6","e":"The literal itself is a six-byte array."},{"s":15,"p":"What is the output of the following code?","c":"int main()\n{\n    char *p = \"hello\";\n    printf(\"%zu\", sizeof(p));\n}","o":["5","6","8","1"],"a":"8","e":"p is a pointer, and pointers are eight bytes here."},{"s":15,"p":"What is the output of the following code?","c":"#include <string.h>\n\nint main()\n{\n    char a[10];\n    strcpy(a, \"test\");\n    printf(\"%s%d\", a, (int) strlen(a));\n}","o":["test4","test5","test 4","Compiler error"],"a":"test4","e":"strcpy copies the string with its terminator, and strlen counts four letters."},{"s":15,"p":"What is the output of the following code?","c":"int main()\n{\n    char s[] = \"hello\";\n    char *p = s;\n    printf(\"%c%c\", *p++, *p);\n}","o":["he","hh","ee","Undefined behaviour"],"a":"Undefined behaviour","e":"p is modified and read in the same unsequenced argument list."},{"s":15,"p":"What is the output of the following code?","c":"int main()\n{\n    char c = 'a';\n    char *p = &c;\n    *p = 'z';\n    printf(\"%c\", c);\n}","o":["a","z","Segmentation fault","Compiler error"],"a":"z","e":"The pointer targets an ordinary writable variable."},{"s":15,"p":"What is the output of the following code?","c":"int main()\n{\n    char *arr[3] = {\"one\", \"two\", \"three\"};\n    printf(\"%s\", arr[2]);\n}","o":["one","two","three","Compiler error"],"a":"three","e":"An array of char pointers stores three separate string addresses."},{"s":15,"p":"What is the output of the following code?","c":"int main()\n{\n    char *arr[3] = {\"one\", \"two\", \"three\"};\n    printf(\"%c\", arr[1][0]);\n}","o":["o","t","w","Compiler error"],"a":"t","e":"The first character of the second string."},{"s":15,"p":"What is the output of the following code?","c":"int main()\n{\n    char s[] = \"hello\";\n    s[2] = '\\0';\n    printf(\"%s %zu\", s, sizeof(s));\n}","o":["he 6","hello 6","he 2","hello 3"],"a":"he 6","e":"The early terminator shortens the string but not the array."},{"s":15,"p":"What is the output of the following code?","c":"int main()\n{\n    printf(\"%s\", \"abc\" + 1);\n}","o":["abc","bc","b","Compiler error"],"a":"bc","e":"Pointer arithmetic on the literal skips the first character."},{"s":15,"p":"What is the output of the following code?","c":"int main()\n{\n    char s[5] = \"hello\";\n    printf(\"%zu\", sizeof(s));\n}","o":["5","6","Compiler error","10"],"a":"5","e":"This just fits the five letters with no room for a terminator, which gcc allows for arrays."},{"s":15,"p":"What is the output of the following code?","c":"int main()\n{\n    char a = 'A';\n    char *p = &a;\n    printf(\"%d\", *p + 1);\n}","o":["65","66","B","Compiler error"],"a":"66","e":"The character code plus one, printed as a number."},{"s":16,"p":"What is the output of the following code?","c":"int add(int a, int b)\n{\n    return a + b;\n}\n\nint main()\n{\n    printf(\"%d\", add(2, 3));\n}","o":["5","23","0","Compiler error"],"a":"5","e":"The function returns the sum of its two arguments."},{"s":16,"p":"What is the output of the following code?","c":"void f(int x)\n{\n    x = x + 10;\n}\n\nint main()\n{\n    int x = 5;\n    f(x);\n    printf(\"%d\", x);\n}","o":["5","15","10","Compiler error"],"a":"5","e":"C passes arguments by value, so the function works on a copy."},{"s":16,"p":"What is the output of the following code?","c":"void f(int *x)\n{\n    *x = *x + 10;\n}\n\nint main()\n{\n    int x = 5;\n    f(&x);\n    printf(\"%d\", x);\n}","o":["5","15","10","Compiler error"],"a":"15","e":"Passing the address lets the function reach the caller's variable."},{"s":16,"p":"What is the output of the following code?","c":"void swap(int a, int b)\n{\n    int t = a;\n    a = b;\n    b = t;\n}\n\nint main()\n{\n    int x = 1, y = 2;\n    swap(x, y);\n    printf(\"%d %d\", x, y);\n}","o":["1 2","2 1","0 0","Compiler error"],"a":"1 2","e":"Only the copies inside the function are swapped."},{"s":16,"p":"What is the output of the following code?","c":"void swap(int *a, int *b)\n{\n    int t = *a;\n    *a = *b;\n    *b = t;\n}\n\nint main()\n{\n    int x = 1, y = 2;\n    swap(&x, &y);\n    printf(\"%d %d\", x, y);\n}","o":["1 2","2 1","0 0","Compiler error"],"a":"2 1","e":"Swapping through pointers changes the originals."},{"s":16,"p":"What is the output of the following code?","c":"int f()\n{\n    return 1, 2, 3;\n}\n\nint main()\n{\n    printf(\"%d\", f());\n}","o":["1","3","6","Compiler error"],"a":"3","e":"The comma operator yields its last operand."},{"s":16,"p":"What is the output of the following code?","c":"int f(int n)\n{\n    if (n > 0)\n        return 1;\n    return 0;\n    printf(\"after\");\n}\n\nint main()\n{\n    printf(\"%d\", f(5));\n}","o":["1","0","1after","Compiler error"],"a":"1","e":"Statements after a return in the taken path never run."},{"s":16,"p":"What is the output of the following code?","c":"int main()\n{\n    printf(\"Hello\");\n    main();\n    return 0;\n}","o":["Hello","Infinite recursion","Compile time error","Runtime error"],"a":"Infinite recursion","e":"main may call itself in C, so this repeats until the stack runs out."},{"s":16,"p":"What is the output of the following code?","c":"void f();\n\nint main()\n{\n    f();\n    return 0;\n}\n\nvoid f()\n{\n    printf(\"called\");\n}","o":["called","Nothing","Compiler error","Linker error"],"a":"called","e":"The prototype lets main call a function defined later in the file."},{"s":16,"p":"What is the output of the following code?","c":"int f(int a, int b)\n{\n    return a > b ? a : b;\n}\n\nint main()\n{\n    printf(\"%d\", f(f(1, 2), 3));\n}","o":["1","2","3","Compiler error"],"a":"3","e":"The inner call gives 2, and the outer picks the larger of 2 and 3."},{"s":16,"p":"What is the output of the following code?","c":"int f(int x)\n{\n    x++;\n    return x;\n}\n\nint main()\n{\n    int x = 5;\n    printf(\"%d %d\", f(x), x);\n}","o":["6 5","6 6","5 5","Undefined behaviour"],"a":"6 5","e":"The function returns 6 but the caller's x is untouched, and neither argument modifies the other."},{"s":16,"p":"What is the output of the following code?","c":"int count()\n{\n    static int c = 0;\n    c++;\n    return c;\n}\n\nint main()\n{\n    count();\n    count();\n    printf(\"%d\", count());\n}","o":["1","2","3","0"],"a":"3","e":"A static local survives between calls."},{"s":16,"p":"What is the output of the following code?","c":"int count()\n{\n    int c = 0;\n    c++;\n    return c;\n}\n\nint main()\n{\n    count();\n    count();\n    printf(\"%d\", count());\n}","o":["1","2","3","0"],"a":"1","e":"An ordinary local is created fresh on every call."},{"s":16,"p":"What is the output of the following code?","c":"void f(int a[], int size)\n{\n    a[0] = size;\n}\n\nint main()\n{\n    int a[3] = {1, 2, 3};\n    f(a, 3);\n    printf(\"%d\", a[0]);\n}","o":["1","3","0","Compiler error"],"a":"3","e":"The array parameter is a pointer to the caller's array."},{"s":16,"p":"How should an array be passed to a function that needs its length?","c":"void func(int *array, int size);\n\nint main()\n{\n    int array[10], size = 10;\n    /* which call is correct? */\n}","o":["func(array);","func(*array);","func(array, size);","func(array[size]);"],"a":"func(array, size);","e":"An array decays to a pointer and loses its length, so the size must be passed separately."},{"s":16,"p":"What is the output of the following code?","c":"int f(void)\n{\n    return 7;\n}\n\nint main()\n{\n    printf(\"%d\", f());\n}","o":["7","0","Compiler error","Garbage value"],"a":"7","e":"void in the parameter list means the function takes no arguments."},{"s":16,"p":"What is the output of the following code?","c":"int f(int a)\n{\n    if (a > 0)\n        return a;\n}\n\nint main()\n{\n    printf(\"%d\", f(5));\n}","o":["5","0","Garbage value","Compiler error"],"a":"5","e":"The path taken does return a value; only the missing path would be undefined."},{"s":16,"p":"What is the output of the following code?","c":"int *f()\n{\n    static int a = 42;\n    return &a;\n}\n\nint main()\n{\n    int *p = f();\n    printf(\"%d\", *p);\n}","o":["42","Garbage value","Segmentation fault","Compiler error"],"a":"42","e":"A static local lives for the whole program, so returning its address is safe."},{"s":16,"p":"What is the output of the following code?","c":"int f(int n)\n{\n    return n * 2;\n}\n\nint main()\n{\n    int (*fp)(int) = f;\n    printf(\"%d\", fp(21));\n}","o":["21","42","Address","Compiler error"],"a":"42","e":"A function pointer can be called just like the function itself."},{"s":16,"p":"What is the output of the following code?","c":"int f(int a, int b)\n{\n    return a - b;\n}\n\nint main()\n{\n    printf(\"%d\", f(10, 3));\n}","o":["7","-7","13","Compiler error"],"a":"7","e":"Arguments line up with parameters in order."},{"s":16,"p":"What is the output of the following code?","c":"void f()\n{\n    printf(\"A\");\n}\n\nvoid g()\n{\n    printf(\"B\");\n    f();\n}\n\nint main()\n{\n    g();\n    f();\n}","o":["ABA","BAA","AAB","BAB"],"a":"BAA","e":"g prints B then calls f, and main calls f once more."},{"s":16,"p":"What is the output of the following code?","c":"int f(int n)\n{\n    n = n + 1;\n    return n;\n}\n\nint main()\n{\n    int n = 1;\n    n = f(f(n));\n    printf(\"%d\", n);\n}","o":["1","2","3","4"],"a":"3","e":"The inner call gives 2 and the outer one adds another 1."},{"s":16,"p":"What is the output of the following code?","c":"long fun(int num)\n{\n    int i;\n    long f = 1;\n    for (i = 1; i <= num; i++)\n        f = f * i;\n    return f;\n}\n\nint main()\n{\n    printf(\"%ld\", fun(5));\n}","o":["5","24","120","25"],"a":"120","e":"The loop computes the factorial of 5."},{"s":16,"p":"What is the output of the following code?","c":"int f(int a, int b)\n{\n    return a;\n}\n\nint main()\n{\n    printf(\"%d\", f(1, 2, 3));\n}","o":["1","3","Compiler error","Undefined behaviour"],"a":"Compiler error","e":"Too many arguments for the declared parameter list."},{"s":16,"p":"What is the output of the following code?","c":"void f(int x)\n{\n    if (x)\n        printf(\"yes\");\n    else\n        printf(\"no\");\n}\n\nint main()\n{\n    f(0);\n    f(-1);\n}","o":["yesno","noyes","nono","yesyes"],"a":"noyes","e":"0 is false but -1 is true."},{"s":16,"p":"What is the output of the following code?","c":"int f(int n);\n\nint main()\n{\n    printf(\"%d\", f(3));\n    return 0;\n}\n\nint f(int n)\n{\n    return n * n;\n}","o":["3","6","9","Compiler error"],"a":"9","e":"The prototype matches the later definition."},{"s":16,"p":"What is the output of the following code?","c":"void f(int *a, int *b)\n{\n    int *t = a;\n    a = b;\n    b = t;\n}\n\nint main()\n{\n    int x = 1, y = 2;\n    f(&x, &y);\n    printf(\"%d %d\", x, y);\n}","o":["1 2","2 1","0 0","Compiler error"],"a":"1 2","e":"Only the local copies of the pointers were exchanged, not the values they point to."},{"s":16,"p":"What is the output of the following code?","c":"int g = 10;\n\nvoid f()\n{\n    g = g + 5;\n}\n\nint main()\n{\n    f();\n    printf(\"%d\", g);\n}","o":["10","15","5","Compiler error"],"a":"15","e":"A global variable is shared by every function in the file."},{"s":16,"p":"What is the output of the following code?","c":"int f(int n)\n{\n    return n;\n}\n\nint main()\n{\n    int a = 2;\n    int x = f(a++);\n    int y = f(a++);\n    printf(\"%d\", x + y);\n}","o":["4","5","6","Undefined behaviour"],"a":"5","e":"Each statement is a sequence point, so the calls receive 2 and then 3."},{"s":16,"p":"What is the output of the following code?","c":"double f()\n{\n    return 7 / 2;\n}\n\nint main()\n{\n    printf(\"%.1f\", f());\n}","o":["3.5","3.0","4.0","Compiler error"],"a":"3.0","e":"The division is done in int arithmetic before the value is converted to double."},{"s":17,"p":"What is the output of the following code?","c":"int fact(int n)\n{\n    if (n <= 1)\n        return 1;\n    return n * fact(n - 1);\n}\n\nint main()\n{\n    printf(\"%d\", fact(5));\n}","o":["5","24","120","Infinite recursion"],"a":"120","e":"5*4*3*2*1."},{"s":17,"p":"What will be the output of the program?","c":"int reverse(int);\n\nint main()\n{\n    int no = 5;\n    reverse(no);\n    return 0;\n}\n\nint reverse(int no)\n{\n    if (no == 0)\n        return 0;\n    else\n        printf(\"%d, \", no);\n    reverse(no--);\n}","o":["Print 5, 4, 3, 2, 1","Infinite recursion","Print 1, 2, 3, 4, 5","Print 5, 4, 3, 2, 1, 0"],"a":"Infinite recursion","e":"no-- passes the old value 5 every time, so the argument never shrinks."},{"s":17,"p":"What is the output of the following code?","c":"int reverse(int no)\n{\n    if (no == 0)\n        return 0;\n    printf(\"%d, \", no);\n    return reverse(no - 1);\n}\n\nint main()\n{\n    reverse(5);\n}","o":["5, 4, 3, 2, 1,","1, 2, 3, 4, 5,","Infinite recursion","5, 4, 3, 2, 1, 0,"],"a":"5, 4, 3, 2, 1,","e":"Passing no - 1 shrinks the argument until the base case stops it."},{"s":17,"p":"What is the output of the following code?","c":"void f(int n)\n{\n    if (n == 0)\n        return;\n    f(n - 1);\n    printf(\"%d \", n);\n}\n\nint main()\n{\n    f(3);\n}","o":["3 2 1","1 2 3","3 2 1 0","Infinite recursion"],"a":"1 2 3","e":"Printing after the recursive call unwinds the stack in reverse order."},{"s":17,"p":"What is the output of the following code?","c":"void f(int n)\n{\n    if (n == 0)\n        return;\n    printf(\"%d \", n);\n    f(n - 1);\n}\n\nint main()\n{\n    f(3);\n}","o":["3 2 1","1 2 3","0 1 2 3","Infinite recursion"],"a":"3 2 1","e":"Printing before the call gives the descending order."},{"s":17,"p":"What is the output of the following code?","c":"int compute(int n)\n{\n    if (n > 0)\n    {\n        n = compute(n - 3) + compute(n - 1);\n        return n;\n    }\n    return 1;\n}\n\nint main()\n{\n    printf(\"%d\", compute(5));\n}","o":["6","Stack overflow","9","13"],"a":"9","e":"Each positive n splits into two smaller calls, and the base case returns 1 each time."},{"s":17,"p":"What is the output of the following code?","c":"int fib(int n)\n{\n    if (n <= 1)\n        return n;\n    return fib(n - 1) + fib(n - 2);\n}\n\nint main()\n{\n    printf(\"%d\", fib(7));\n}","o":["8","13","21","7"],"a":"13","e":"The sequence runs 0, 1, 1, 2, 3, 5, 8, 13."},{"s":17,"p":"What is the output of the following code?","c":"int sum(int n)\n{\n    if (n == 0)\n        return 0;\n    return n + sum(n - 1);\n}\n\nint main()\n{\n    printf(\"%d\", sum(10));\n}","o":["10","45","55","100"],"a":"55","e":"The sum of 1 through 10."},{"s":17,"p":"What is the output of the following code?","c":"int f(int n)\n{\n    if (n == 0)\n        return 1;\n    return 2 * f(n - 1);\n}\n\nint main()\n{\n    printf(\"%d\", f(5));\n}","o":["10","32","16","64"],"a":"32","e":"Each level doubles, giving 2 to the power 5."},{"s":17,"p":"What is the output of the following code?","c":"int f(int n)\n{\n    if (n < 0)\n        return 0;\n    return n % 10 + f(n / 10);\n}\n\nint main()\n{\n    printf(\"%d\", f(123));\n}","o":["6","123","3","Infinite recursion"],"a":"Infinite recursion","e":"The guard is n < 0, but n never goes below 0: f(0) calls f(0) forever."},{"s":17,"p":"What is the output of the following code?","c":"int f(int n)\n{\n    if (n == 0)\n        return 0;\n    return n % 10 + f(n / 10);\n}\n\nint main()\n{\n    printf(\"%d\", f(123));\n}","o":["6","123","3","Infinite recursion"],"a":"6","e":"Digit sum 3 + 2 + 1, stopping when n reaches 0."},{"s":17,"p":"What is the output of the following code?","c":"void f(int n)\n{\n    if (n <= 0)\n        return;\n    f(n / 2);\n    printf(\"%d \", n % 2);\n}\n\nint main()\n{\n    f(5);\n}","o":["1 0 1","1 0","1 1 0","0 1 1"],"a":"1 0 1","e":"This prints the binary form of 5."},{"s":17,"p":"What is the output of the following code?","c":"int f(int n)\n{\n    if (n == 1)\n        return 1;\n    return n + f(n - 1);\n}\n\nint main()\n{\n    printf(\"%d\", f(4));\n}","o":["4","10","24","6"],"a":"10","e":"4 + 3 + 2 + 1."},{"s":17,"p":"What is the output of the following code?","c":"int f(int a, int b)\n{\n    if (b == 0)\n        return a;\n    return f(b, a % b);\n}\n\nint main()\n{\n    printf(\"%d\", f(12, 18));\n}","o":["2","6","12","18"],"a":"6","e":"This is Euclid's algorithm for the greatest common divisor."},{"s":17,"p":"What is the output of the following code?","c":"void f(int n)\n{\n    printf(\"%d \", n);\n    if (n > 0)\n        f(n - 1);\n}\n\nint main()\n{\n    f(3);\n}","o":["3 2 1","3 2 1 0","0 1 2 3","Infinite recursion"],"a":"3 2 1 0","e":"The print happens before the guard, so zero is printed too."},{"s":17,"p":"What is the output of the following code?","c":"int f(int n)\n{\n    static int c = 0;\n    if (n == 0)\n        return c;\n    c++;\n    return f(n - 1);\n}\n\nint main()\n{\n    printf(\"%d\", f(4));\n}","o":["0","4","5","10"],"a":"4","e":"The static counter is incremented once per level."},{"s":17,"p":"What is the output of the following code?","c":"int f(int n)\n{\n    if (n <= 1)\n        return 1;\n    return f(n - 1) * n;\n}\n\nint main()\n{\n    printf(\"%d\", f(0));\n}","o":["0","1","Infinite recursion","Compiler error"],"a":"1","e":"The guard n <= 1 also catches 0 and negative values."},{"s":17,"p":"What is the output of the following code?","c":"int f(int n)\n{\n    if (n == 1)\n        return 1;\n    return f(n - 2);\n}\n\nint main()\n{\n    printf(\"%d\", f(4));\n}","o":["1","0","Infinite recursion","4"],"a":"Infinite recursion","e":"From an even start the argument steps 4, 2, 0, -2 ... and never equals 1."},{"s":17,"p":"What is the output of the following code?","c":"void f(int n)\n{\n    if (n == 0)\n        return;\n    printf(\"%d \", n);\n    f(n - 1);\n    printf(\"%d \", n);\n}\n\nint main()\n{\n    f(2);\n}","o":["2 1 1 2","2 1","1 2 2 1","2 1 2 1"],"a":"2 1 1 2","e":"Each level prints once on the way down and once on the way back up."},{"s":17,"p":"What is the output of the following code?","c":"int f(int n)\n{\n    return n == 0 ? 0 : n + f(n - 1);\n}\n\nint main()\n{\n    printf(\"%d\", f(5));\n}","o":["5","10","15","120"],"a":"15","e":"The conditional operator gives the same structure as an if with a base case."},{"s":17,"p":"What is the output of the following code?","c":"int f(int n)\n{\n    if (n > 100)\n        return n - 10;\n    return f(f(n + 11));\n}\n\nint main()\n{\n    printf(\"%d\", f(99));\n}","o":["89","91","99","Infinite recursion"],"a":"91","e":"This is McCarthy's 91 function, which returns 91 for every input up to 100."},{"s":17,"p":"What is the output of the following code?","c":"int f(int n)\n{\n    if (n == 0)\n        return 0;\n    return f(n - 1) + f(n - 1);\n}\n\nint main()\n{\n    printf(\"%d\", f(10));\n}","o":["0","1024","10","Infinite recursion"],"a":"0","e":"Every branch eventually returns 0, so the sum of zeros is zero."},{"s":17,"p":"What is the output of the following code?","c":"void f(int n)\n{\n    if (n)\n    {\n        f(n - 1);\n        f(n - 1);\n        printf(\"%d\", n);\n    }\n}\n\nint main()\n{\n    f(2);\n}","o":["112","1122","221","12"],"a":"112","e":"f(2) makes two f(1) calls, each printing 1, and then prints 2."},{"s":17,"p":"What is the output of the following code?","c":"int f(int n)\n{\n    if (n <= 0)\n        return 0;\n    if (n % 2 == 0)\n        return n + f(n - 1);\n    return f(n - 1);\n}\n\nint main()\n{\n    printf(\"%d\", f(6));\n}","o":["12","21","6","9"],"a":"12","e":"Only the even numbers 6, 4 and 2 are added."},{"s":17,"p":"What is the output of the following code?","c":"int f(int n)\n{\n    if (n == 0)\n        return 1;\n    if (n == 1)\n        return 1;\n    return f(n - 1) + f(n - 2);\n}\n\nint main()\n{\n    printf(\"%d\", f(5));\n}","o":["5","8","13","3"],"a":"8","e":"With both base cases equal to 1 the series runs 1, 1, 2, 3, 5, 8."},{"s":17,"p":"What is the output of the following code?","c":"int f(int n, int acc)\n{\n    if (n == 0)\n        return acc;\n    return f(n - 1, acc * n);\n}\n\nint main()\n{\n    printf(\"%d\", f(4, 1));\n}","o":["4","10","24","1"],"a":"24","e":"This is factorial written with an accumulator."},{"s":17,"p":"What is the output of the following code?","c":"void f(char *s)\n{\n    if (*s == '\\0')\n        return;\n    f(s + 1);\n    printf(\"%c\", *s);\n}\n\nint main()\n{\n    f(\"abc\");\n}","o":["abc","cba","a","Infinite recursion"],"a":"cba","e":"The characters print as the recursion unwinds, reversing the string."},{"s":17,"p":"What is the output of the following code?","c":"int f(int n)\n{\n    if (n == 0)\n        return 0;\n    return 1 + f(n / 2);\n}\n\nint main()\n{\n    printf(\"%d\", f(8));\n}","o":["3","4","8","Infinite recursion"],"a":"4","e":"8, 4, 2 and 1 each add one before the argument reaches 0."},{"s":17,"p":"Which part of a recursive function stops it from running forever?","c":"","o":["The return type","The base case","The recursive call","The function prototype"],"a":"The base case","e":"Without a condition that returns without recursing, the calls never stop."},{"s":17,"p":"What happens when a recursive function never reaches its base case?","c":"","o":["The compiler reports an error","It returns 0","The stack overflows and the program crashes","It runs but returns garbage"],"a":"The stack overflows and the program crashes","e":"Each call uses stack space, and that space eventually runs out."},{"s":18,"p":"What is the output of the following code?","c":"int x = 5;\n\nvoid f()\n{\n    printf(\"%d \", x);\n}\n\nint main()\n{\n    int x = 10;\n    f();\n    printf(\"%d\", x);\n}","o":["5 10","10 10","5 5","10 5"],"a":"5 10","e":"f sees the global; main's local hides it only inside main."},{"s":18,"p":"What is the output of the following code?","c":"int main()\n{\n    int x = 1;\n    {\n        int x = 2;\n        x++;\n    }\n    printf(\"%d\", x);\n}","o":["1","2","3","Compiler error"],"a":"1","e":"The inner block had its own x, which disappears at the closing brace."},{"s":18,"p":"What is the output of the following code?","c":"int main()\n{\n    int i;\n    for (i = 0; i < 3; i++)\n    {\n        static int s = 0;\n        int a = 0;\n        s++;\n        a++;\n        printf(\"%d%d \", s, a);\n    }\n}","o":["11 21 31","11 22 33","11 11 11","33 33 33"],"a":"11 21 31","e":"The static keeps counting while the ordinary local resets each pass."},{"s":18,"p":"What is the output of the following code?","c":"void f()\n{\n    int x = 0;\n    x++;\n    printf(\"%d \", x);\n}\n\nint main()\n{\n    f();\n    f();\n}","o":["1 1","1 2","0 0","2 2"],"a":"1 1","e":"The local is reinitialised on every call."},{"s":18,"p":"What is the output of the following code?","c":"void f()\n{\n    static int x = 0;\n    x++;\n    printf(\"%d \", x);\n}\n\nint main()\n{\n    f();\n    f();\n}","o":["1 1","1 2","0 0","2 2"],"a":"1 2","e":"The static initialiser runs once and the value persists."},{"s":18,"p":"What is the output of the following code?","c":"int counter;\n\nint main()\n{\n    printf(\"%d\", counter);\n}","o":["0","Garbage value","Compiler error","1"],"a":"0","e":"Globals with no initialiser start at zero."},{"s":18,"p":"What is the output of the following code?","c":"int main()\n{\n    int x = 10;\n    if (1)\n    {\n        int x = 20;\n        printf(\"%d \", x);\n    }\n    printf(\"%d\", x);\n}","o":["20 10","10 20","20 20","10 10"],"a":"20 10","e":"Each block introduces its own scope."},{"s":18,"p":"What is the output of the following code?","c":"void f(int x)\n{\n    x = 100;\n}\n\nint x = 5;\n\nint main()\n{\n    f(x);\n    printf(\"%d\", x);\n}","o":["5","100","0","Compiler error"],"a":"5","e":"The parameter x hides the global inside f, and it is only a copy anyway."},{"s":18,"p":"What is the output of the following code?","c":"int main()\n{\n    register int i;\n    int sum = 0;\n    for (i = 1; i <= 5; i++)\n        sum += i;\n    printf(\"%d\", sum);\n}","o":["15","5","0","Compiler error"],"a":"15","e":"register is only a hint; the loop behaves normally."},{"s":18,"p":"What is the output of the following code?","c":"int main()\n{\n    register int i = 5;\n    int *p = &i;\n    printf(\"%d\", *p);\n}","o":["5","0","Compiler error","Garbage value"],"a":"Compiler error","e":"The address of a register variable cannot be taken."},{"s":18,"p":"What is the output of the following code?","c":"int *f()\n{\n    int a = 42;\n    return &a;\n}\n\nint main()\n{\n    int *p = f();\n    printf(\"%d\", *p);\n}","o":["42","Always 0","Undefined behaviour, the local is gone","Compiler error"],"a":"Undefined behaviour, the local is gone","e":"The local dies when the function returns, leaving a dangling pointer."},{"s":18,"p":"What is the output of the following code?","c":"int f()\n{\n    static int a[3] = {1, 2, 3};\n    return a[1];\n}\n\nint main()\n{\n    printf(\"%d\", f());\n}","o":["1","2","3","Garbage value"],"a":"2","e":"A static array is initialised once and lives for the whole program."},{"s":18,"p":"What is the output of the following code?","c":"int main()\n{\n    int x = 5;\n    {\n        x = x + 1;\n    }\n    printf(\"%d\", x);\n}","o":["5","6","Compiler error","0"],"a":"6","e":"The inner block did not declare a new x, so it edits the outer one."},{"s":18,"p":"What is the output of the following code?","c":"void f()\n{\n    int x;\n    printf(\"%d\", x);\n}\n\nint main()\n{\n    f();\n}","o":["0","Garbage or indeterminate value","Compiler error","-1"],"a":"Garbage or indeterminate value","e":"Automatic variables are not zero initialised."},{"s":18,"p":"What is the output of the following code?","c":"int main()\n{\n    int i = 0;\n    for (int i = 5; i < 6; i++)\n        printf(\"%d \", i);\n    printf(\"%d\", i);\n}","o":["5 0","5 6","0 0","Compiler error"],"a":"5 0","e":"The loop declares its own i, which vanishes at the end of the loop."},{"s":18,"p":"What is the output of the following code?","c":"const int size = 5;\n\nint main()\n{\n    printf(\"%d\", size);\n}","o":["5","0","Compiler error","Garbage value"],"a":"5","e":"A const global is a normal read-only variable."},{"s":18,"p":"What is the output of the following code?","c":"int main()\n{\n    static int x = 5;\n    x++;\n    printf(\"%d\", x);\n}","o":["5","6","0","Compiler error"],"a":"6","e":"A static local can still be modified; it just keeps its value between calls."},{"s":18,"p":"What is the output of the following code?","c":"int f(void)\n{\n    static int i = 10;\n    return i--;\n}\n\nint main()\n{\n    f();\n    f();\n    printf(\"%d\", f());\n}","o":["10","9","8","7"],"a":"8","e":"The first two calls return 10 and 9, leaving 8 for the third."},{"s":18,"p":"What is the output of the following code?","c":"int x = 1;\n\nint main()\n{\n    int x = 2;\n    {\n        extern int x;\n        printf(\"%d\", x);\n    }\n}","o":["1","2","0","Compiler error"],"a":"1","e":"The extern declaration refers back to the global object."},{"s":18,"p":"What is the output of the following code?","c":"void f()\n{\n    printf(\"in f \");\n}\n\nint main()\n{\n    void f();\n    f();\n    printf(\"done\");\n}","o":["in f done","done","Compiler error","in f"],"a":"in f done","e":"A function may be declared inside a block; it still refers to the same function."},{"s":18,"p":"What is the output of the following code?","c":"int main()\n{\n    int a = 1;\n    int a = 2;\n    printf(\"%d\", a);\n}","o":["1","2","Compiler error","Garbage value"],"a":"Compiler error","e":"The same name cannot be declared twice in one scope."},{"s":18,"p":"What is the output of the following code?","c":"int main()\n{\n    printf(\"%d\", x);\n    int x = 5;\n}","o":["5","0","Compiler error","Garbage value"],"a":"Compiler error","e":"A variable must be declared before it is used."},{"s":18,"p":"What is the output of the following code?","c":"int f()\n{\n    int a = 1;\n    {\n        int a = 2;\n        {\n            int a = 3;\n            printf(\"%d\", a);\n        }\n    }\n    return 0;\n}\n\nint main()\n{\n    f();\n}","o":["1","2","3","6"],"a":"3","e":"The innermost declaration wins at the point of use."},{"s":18,"p":"What is the output of the following code?","c":"int total = 0;\n\nvoid add(int n)\n{\n    total += n;\n}\n\nint main()\n{\n    add(3);\n    add(4);\n    printf(\"%d\", total);\n}","o":["3","4","7","0"],"a":"7","e":"Both calls update the same global."},{"s":18,"p":"What is the output of the following code?","c":"void f()\n{\n    static int calls;\n    calls++;\n    if (calls < 3)\n        f();\n    printf(\"%d \", calls);\n}\n\nint main()\n{\n    f();\n}","o":["1 2 3","3 3 3","3","1 1 1"],"a":"3 3 3","e":"All three levels read the same static variable after the recursion has finished counting."},{"s":19,"p":"What is the output of the following code?","c":"int *m();\n\nint main()\n{\n    int *k = m();\n    printf(\"hello \");\n    printf(\"%d\", k[0]);\n    return 0;\n}\n\nint *m()\n{\n    int a[2] = {2, 7};\n    return a;\n}","o":["hello 2","Undefined behaviour, a is destroyed on return","hello 7","Compilation error"],"a":"Undefined behaviour, a is destroyed on return","e":"The local array's memory is released when m returns, so k dangles."},{"s":19,"p":"What is the output of the following code?","c":"int main()\n{\n    int *p = NULL;\n    printf(\"%d\", *p);\n}","o":["0","NULL","Segmentation fault","Compiler error"],"a":"Segmentation fault","e":"Dereferencing a null pointer traps on any normal system."},{"s":19,"p":"What is the output of the following code?","c":"#include <stdlib.h>\n\nint main()\n{\n    int *p = malloc(sizeof(int));\n    *p = 7;\n    printf(\"%d\", *p);\n    free(p);\n}","o":["7","0","Segmentation fault","Compiler error"],"a":"7","e":"Allocated memory is valid until it is freed."},{"s":19,"p":"What is the output of the following code?","c":"#include <stdlib.h>\n\nint main()\n{\n    int *p = malloc(sizeof(int));\n    *p = 7;\n    free(p);\n    printf(\"%d\", *p);\n}","o":["7","0","Undefined behaviour, p is dangling","Compiler error"],"a":"Undefined behaviour, p is dangling","e":"After free the pointer no longer refers to memory you own."},{"s":19,"p":"What is the output of the following code?","c":"#include <stdlib.h>\n\nint main()\n{\n    int *p = calloc(3, sizeof(int));\n    printf(\"%d %d\", p[0], p[2]);\n    free(p);\n}","o":["0 0","Garbage values","Segmentation fault","Compiler error"],"a":"0 0","e":"calloc zeroes the memory it hands back, unlike malloc."},{"s":19,"p":"What is the output of the following code?","c":"#include <stdlib.h>\n\nint main()\n{\n    int *p = malloc(3 * sizeof(int));\n    printf(\"%zu\", sizeof(p));\n    free(p);\n}","o":["12","8","3","4"],"a":"8","e":"sizeof on a pointer gives the pointer size, not the allocated block size."},{"s":19,"p":"What is the output of the following code?","c":"int main()\n{\n    int a[3] = {1, 2, 3};\n    int *p = a + 3;\n    printf(\"%d\", *p);\n}","o":["3","0","Undefined behaviour, p is one past the end","Compiler error"],"a":"Undefined behaviour, p is one past the end","e":"Forming that address is legal, but reading through it is not."},{"s":19,"p":"What is the output of the following code?","c":"int main()\n{\n    char *s;\n    s = \"hello\";\n    printf(\"%s\", s);\n}","o":["hello","Segmentation fault","Garbage value","Compiler error"],"a":"hello","e":"Pointing a char pointer at a literal is fine; only writing through it is not."},{"s":19,"p":"What is the output of the following code?","c":"#include <string.h>\n\nint main()\n{\n    char *s;\n    strcpy(s, \"hello\");\n    printf(\"%s\", s);\n}","o":["hello","Undefined behaviour, s points nowhere","Compiler error","Nothing"],"a":"Undefined behaviour, s points nowhere","e":"s was never given memory. It often crashes, but the standard gives no guarantee at all."},{"s":19,"p":"What is the output of the following code?","c":"int main()\n{\n    int a = 5;\n    int *p = &a;\n    p = NULL;\n    printf(\"%d\", a);\n}","o":["5","0","Segmentation fault","Compiler error"],"a":"5","e":"Clearing the pointer does not touch the variable it used to point at."},{"s":19,"p":"What is the output of the following code?","c":"#include <stdlib.h>\n\nint main()\n{\n    int *p = malloc(2 * sizeof(int));\n    p[0] = 1;\n    p[1] = 2;\n    printf(\"%d\", p[0] + p[1]);\n    free(p);\n}","o":["3","1","Segmentation fault","Compiler error"],"a":"3","e":"Allocated memory can be indexed like an array."},{"s":19,"p":"What is the output of the following code?","c":"#include <stdlib.h>\n\nint main()\n{\n    int *p = malloc(sizeof(int));\n    free(p);\n    free(p);\n    printf(\"done\");\n}","o":["done","Undefined behaviour, double free","0","Compiler error"],"a":"Undefined behaviour, double free","e":"Freeing the same block twice corrupts the allocator."},{"s":19,"p":"What is the output of the following code?","c":"int main()\n{\n    int a[3] = {1, 2, 3};\n    a[5] = 10;\n    printf(\"%d\", a[0]);\n}","o":["1","10","Always a segmentation fault","Compiler error"],"a":"1","e":"The out of bounds write is undefined and may silently damage other memory; here a[0] is unchanged."},{"s":19,"p":"What is the output of the following code?","c":"int main()\n{\n    int a = 5;\n    int *p = &a;\n    printf(\"%d\", *p == a);\n}","o":["0","1","Segmentation fault","Compiler error"],"a":"1","e":"The dereferenced pointer gives exactly the value of a."},{"s":19,"p":"What is the output of the following code?","c":"void f(int **p)\n{\n    *p = NULL;\n}\n\nint main()\n{\n    int a = 5;\n    int *p = &a;\n    f(&p);\n    printf(\"%s\", p == NULL ? \"null\" : \"not null\");\n}","o":["null","not null","Segmentation fault","Compiler error"],"a":"null","e":"The double pointer lets the function change the caller's pointer."},{"s":19,"p":"What is the output of the following code?","c":"int main()\n{\n    int x = 10;\n    int *p = &x;\n    int *q = p + 1;\n    printf(\"%ld\", q - p);\n}","o":["1","4","8","Compiler error"],"a":"1","e":"Pointer differences count elements, and the difference of adjacent addresses is 1."},{"s":19,"p":"What is the output of the following code?","c":"#include <stdlib.h>\n\nint main()\n{\n    char *s = malloc(6);\n /* ---------------- seeded RNG for shared/shareable tests ---------------- */
function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const seededShuffle = (a, rand) => { a = a.slice(); for (let i = a.length-1; i > 0; i--) { const j = Math.floor(rand()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };

function buildSeededQuestions(topics, n, seed){
  const rand = mulberry32(seed);
  const filtered = BANK.filter(q => topics.includes(q.s));
  const chosen = seededShuffle(filtered, rand).slice(0, Math.min(n, filtered.length));
  return chosen.map(q => ({ ...q, opts: seededShuffle(q.o, rand) }));
}

function highlight(line){
  let s = esc(line);
  s = s.replace(/"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'/g, m => '\u0001' + m + '\u0002');
  s = s.replace(/\b(int|char|float|double|short|long|unsigned|signed|const|static|void|if|else|switch|case|default|break|continue|for|while|do|return|sizeof|struct)\b/g, '<span class="kw">$1</span>');
  s = s.replace(/\b(printf|main)\b/g, '<span class="fn">$1</span>');
  s = s.replace(/\b(0[xX][0-9a-fA-F]+|\d+\.?\d*)\b/g, '<span class="num">$1</span>');
  s = s.replace(/\u0001([\s\S]*?)\u0002/g, '<span class="str">$1</span>');
  return s;
}
function codeBlock(code, name){
  const lines = String(code).split('\n').map((l, i) => '<span class="ln">' + (i+1) + '</span>' + highlight(l)).join('\n');
  return '<div class="filebar"><span class="dot"></span><span class="dot"></span><span class="dot"></span>&nbsp;' + name + '</div><pre class="code">' + lines + '</pre>';
}

  S = null;

  <div class="login-wrap sheet">
    <div class="hero" style="padding:32px 32px 8px">
      <div class="brand"><h1>Kanth's "C" quiz<span class="caret"></span></h1></div>

      <div class="err">${loginErr ? esc(loginErr) : ''}</div>
      <button class="btn primary" type="submit" style="width:100%">Log in</button>
    </form>
  </div>

}

function doLogin(username, password){
  const key = (username || '').trim().toLowerCase();
  const u = USERS[key];
  if (!u || u.password !== password) { screenLogin('Unknown username or wrong password.'); return; }
  session = { username: key, name: u.name, role: u.role };
  LS.set('cquiz_session', session);
  justLoggedIn = true;
  screenSetup();
}

function doLogout(){
  session = null;
  LS.set('cquiz_session', null);
  screenLogin();
}

/* ---------------- setup ---------------- */

  root.innerHTML = `
  <div class="topbar-user">

  <div class="sheet">

      <div class="linkrow" style="margin-top:14px">

      </div>
      <p class="tiny" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">Tap a topic to include or drop it.

        <input id="joinKey" placeholder="Paste the short code or the full key" style="flex:1;min-width:220px;font:13px var(--mono);padding:10px 12px;border:1px solid var(--rule);border-radius:3px">

/* ---------------- test ---------------- */
function startTest(list, share){
  const qs = (Array.isArray(list) && list.length)
    ? list
    : shuffle(pool()).slice(0, size).map(q => ({...q, opts: shuffle(q.o)}));
  if (!qs.length) { screenSetup(); return; }
  if (S && S.timer) clearInterval(S.timer);
  S = { qs, at: 0, given: new Array(qs.length).fill(null), t0: Date.now(), secs: 0, done: false, saved: false, timer: null, share: share || null };
  S.timer = setInterval(() => {
    if (!S || S.done) return;
    S.secs = Math.round((Date.now() - S.t0) / 1000);
    const el = root.querySelector('[data-clock]');
    if (el) el.textContent = fmtTime(S.secs);
  }, 1000);
  screenQuestion();
}

function launchSharedTest(){
  if (!session) { screenLogin(); return; }
  const topics = Array.from(picked);
  const n = Math.min(size, pool().length);
  if (!n) return;
  const seed = Math.floor(Math.random() * 1e9);
  const payload = { t: topics, n, sd: seed, cr: session.username, crName: session.name, ts: Date.now() };
  const fullKey = encodeKey(payload);
  let code;
  do { code = shortCode(); } while (findLaunchByCode(code));
  saveLaunch({ code, fullKey, creator: session.username, creatorName: session.name, topics, size: n, seed, createdAt: payload.ts, ended: false });
  const qs = buildSeededQuestions(topics, n, seed);
  startTest(qs, { fullKey, code, creator: session.username, creatorName: session.name, isCreator: true, ended: false });
  window.scrollTo(0, 0);
}

function joinSharedTest(raw){
  const errEl = root.querySelector('#joinErr');
  const input = (raw || '').trim();
  if (!input) { if (errEl) errEl.textContent = 'Enter a code or key first.'; return; }
  let rec = null, payload = null;
  if (/^[A-Z0-9]{4,8}$/i.test(input)) rec = findLaunchByCode(input);
  if (rec) { payload = { t: rec.topics, n: rec.size, sd: rec.seed, cr: rec.creator, crName: rec.creatorName, ts: rec.createdAt }; }
  else { payload = decodeKey(input); }
  if (!payload || !Array.isArray(payload.t) || !payload.n) {
    if (errEl) errEl.textContent = "That code or key isn't valid.";
    return;
  }
  const fullKey = encodeKey(payload);
  if (isEnded(fullKey)) { if (errEl) errEl.textContent = 'This test was already ended by its creator.'; return; }
  const qs = buildSeededQuestions(payload.t, payload.n, payload.sd);
  if (!qs.length) { if (errEl) errEl.textContent = 'No matching questions found for that key.'; return; }
  const isCreator = session && session.username === payload.cr;
  startTest(qs, { fullKey, code: rec ? rec.code : null, creator: payload.cr, creatorName: payload.crName, isCreator, ended: false });
  window.scrollTo(0, 0);
}

function endSharedTest(){
  if (!S || !S.share || !S.share.isCreator) return;
  markEnded(S.share.fullKey);
  S.share.ended = true;
  screenQuestion();
}

function screenQuestion(){
  if (!S || !S.qs.length) { screenSetup(); return; }
  S.at = Math.min(Math.max(S.at, 0), S.qs.length - 1);
  const q = S.qs[S.at];
  if (!q) { screenSetup(); return; }
  const answered = S.given.filter(x => x !== null).length;
  const last = S.at === S.qs.length - 1;
  root.innerHTML = `
  <div class="topbar"><div class="topbar-in">
    <span class="stat">Q ${S.at+1}<span class="muted">/${S.qs.length}</span></span>
    <div class="progress"><i style="width:${(answered/S.qs.length)*100}%"></i></div>
    <span class="stat">${answered} answered</span>
    <span class="stat" data-clock>${fmtTime(S.secs)}</span>
  </div></div>
  ${S.share ? `<div class="badge-share ${S.share.ended ? 'ended' : ''}">
      ${S.share.ended ? 'This shared test has been ended by its creator' :
        (S.share.isCreator ? `You launched this test &middot; code <b>${esc(S.share.code || '')}</b>`
                            : `Shared test by ${esc(S.share.creatorName || S.share.creator)} &middot; code ${esc(S.share.code || '')}`)}
      ${S.share.isCreator && !S.share.ended ? `<button class="linkbtn" data-act="endtest">End test</button>` : ''}
    </div>` : ''}
  <div class="qhead">
    <span class="eyebrow">Question ${S.at+1}</span>
    <span class="sec">${esc(secName(q))}</span>
  </div>
  <div class="sheet">
    ${q.c ? codeBlock(q.c, fileName(S.at)) : ''}
    <p class="prompt">${esc(q.p || 'What is the output of the following code?')}</p>
    <div class="opts">
      ${q.opts.map((o, i) => `<button class="opt" data-act="pick" data-i="${i}" aria-pressed="${S.given[S.at] === o}">
        <span class="key">${i+1}</span><span class="txt">${esc(o)}</span></button>`).join('')}
    </div>
  </div>
  <div class="navrow">
    <button class="btn ghost" data-act="prev" ${S.at === 0 ? 'disabled' : ''}>&larr; Previous</button>
    <div style="display:flex;gap:8px">
      <button class="btn ghost" data-act="clear" ${S.given[S.at] === null ? 'disabled' : ''}>Clear</button>
      ${last ? '<button class="btn primary" data-act="finish">Finish test</button>'
             : '<button class="btn" data-act="next">Next &rarr;</button>'}
    </div>
  </div>
  <div class="palette">
    ${S.qs.map((_, i) => `<button class="pbtn ${S.given[i] !== null ? 'done' : ''} ${i === S.at ? 'now' : ''}" data-act="jump" data-i="${i}">${i+1}</button>`).join('')}
    <button class="btn ghost" style="margin-left:auto" data-act="submit">Submit &amp; score</button>
  </div>`;
}

/* ---------------- results ---------------- */
function screenResult(){
  if (!S) { screenSetup(); return; }
  if (S.timer) clearInterval(S.timer);
  S.done = true;
  const qs = S.qs, given = S.given;
  const right = qs.filter((q, i) => given[i] === q.a).length;
  const skipped = given.filter(x => x === null).length;
  const wrong = qs.length - right - skipped;
  const pct = Math.round(right / qs.length * 100);
  const verdict = pct >= 90 ? 'Solid. The tricky ones are landing.'
                : pct >= 70 ? 'Good base &mdash; the misses cluster, see below.'
                : pct >= 50 ? 'Halfway. Work the wrong list, then retake.'
                : 'Plenty to pick up. Read every explanation below.';
  const bySec = SECTIONS.map((sc, i) => ({
    s: sc.n, tot: qs.filter(q => q.s === i).length, ok: qs.filter((q, j) => q.s === i && given[j] === q.a).length
  })).filter(r => r.tot);

  if (!S.saved && session) {
    S.saved = true;
    saveResult({
      id: Date.now() + '-' + Math.random().toString(36).slice(2, 8),
      username: session.username, name: session.name,
      fullKey: S.share ? S.share.fullKey : null,
      code: S.share ? S.share.code : null,
      creator: S.share ? S.share.creator : null,
      creatorName: S.share ? S.share.creatorName : null,
      topics: [...new Set(qs.map(q => q.s))].map(secLabel),
      size: qs.length, right, wrong, skipped, pct, secs: S.secs, timestamp: Date.now(),
      review: qs.map((q, i) => ({ s: q.s, p: q.p, c: q.c, opts: q.opts, a: q.a, given: given[i] }))
    });
  }
  const shareNote = S.share
    ? `<p class="tiny" style="padding:0 32px 16px">${S.share.isCreator ? 'As the creator, you' : 'You'} can see every saved attempt for this test from <a data-act="dashboard" style="color:var(--accent)">the dashboard</a> on this device.</p>`
    : '';

  root.innerHTML = `
  ${shareNote}
  <div class="sheet scoreboard">
    <div class="score-main">
      <span class="eyebrow">Score</span>
      <div class="bigscore">${pct}<small>%</small></div>
      <div class="verdict">${verdict}</div>
      <div class="tally">
        <div class="t-ok"><b>${right}</b>correct</div>
        <div class="t-bad"><b>${wrong}</b>wrong</div>
        <div class="t-skip"><b>${skipped}</b>skipped</div>
        <div><b>${fmtTime(S.secs)}</b>time</div>
      </div>
    </div>
    <div class="breakdown">
      <span class="eyebrow">By topic</span>
      <div style="margin-top:14px">
      ${bySec.map(r => `<div class="bd-row">
        <div class="bd-top"><span>${esc(r.s)}</span><span>${r.ok}/${r.tot}</span></div>
        <div class="bar"><i style="width:${(r.ok/r.tot)*100}%"></i></div></div>`).join('')}
      </div>
    </div>
  </div>
  <div class="review-tools">
    <span class="eyebrow">Review</span>
    <button class="chip" data-act="filter" data-f="all" aria-pressed="true">All</button>
    <button class="chip" data-act="filter" data-f="wrong" aria-pressed="false">Wrong &amp; skipped</button>
    <span style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn ghost" data-act="retake">Retake this set</button>
      <button class="btn ghost" data-act="drill" ${wrong + skipped ? '' : 'disabled'}>Drill the misses</button>
      <button class="btn primary" data-act="new">New test</button>
    </span>
  </div>
  <div class="review">${qs.map((q, i) => revCard(q, i, given[i])).join('')}</div>
  <p class="footer">cquiz &middot; ${BANK.length} questions &middot; answers verified against gcc 13, 64-bit Linux</p>`;
}

function revCard(q, i, ans){
  const state = ans === null ? 'skip' : (ans === q.a ? 'right' : 'wrong');
  const label = { right:'Correct', wrong:'Wrong', skip:'Skipped' }[state];
  return `<div class="sheet rev ${state} ${state === 'right' ? '' : 'open'}">
    <div class="rev-head" data-act="toggle"><span class="tag ${state}">${label}</span><span>Question ${i+1}</span>
      <span class="muted" style="margin-left:auto">${esc(secName(q))}</span></div>
    <div class="rev-body">
      ${q.c ? codeBlock(q.c, fileName(i)) : ''}
      <p class="prompt" style="padding:12px 18px 0;font-size:14px">${esc(q.p || '')}</p>
      <div class="answers">
        <div class="row"><span class="lbl">Your answer</span>${ans === null ? '<span class="muted">&mdash; not answered</span>' : esc(ans)}</div>
        <div class="row"><span class="lbl">Correct answer</span><b>${esc(q.a)}</b></div>
      </div>
      <div class="why">${esc(q.e)}</div>
    </div>
  </div>`;
}

/* ---------------- saved-result review (from dashboard / my results) ---------------- */
function savedRevCard(r, i){
  const state = r.given === null ? 'skip' : (r.given === r.a ? 'right' : 'wrong');
  const label = { right:'Correct', wrong:'Wrong', skip:'Skipped' }[state];
  return `<div class="sheet rev ${state} ${state === 'right' ? '' : 'open'}">
    <div class="rev-head" data-act="toggle"><span class="tag ${state}">${label}</span><span>Question ${i+1}</span>
      <span class="muted" style="margin-left:auto">${esc(secLabel(r.s))}</span></div>
    <div class="rev-body">
      ${r.c ? codeBlock(r.c, fileName(i)) : ''}
      <p class="prompt" style="padding:12px 18px 0;font-size:14px">${esc(r.p || '')}</p>

        <div class="row"><span class="lbl">Correct answer</span><b>${esc(r.a)}</b></div>

}
